    ${known.length ? `<label>Start from an existing candidate<select id="t-copy"><option value="">- choose -</option>${known.map(c => `<option value="${esc(c.candidate_id)}">${esc(c.candidate_id)} - ${esc(c.name)}</option>`).join("")}</select></label>` : ""}
    <label>Candidate name<input id="t-name" required maxlength="160" placeholder="e.g. Fuel truck on the runway without clearance" value="${esc(f.name)}"></label>
    <label>Definition<textarea id="t-def" maxlength="1200" placeholder="One or two sentences describing what the category covers.">${esc(f.definition)}</textarea></label>
    <label>Proposed parent (optional - checked by G8)<select id="t-prop"><option value="">none</option>${pars.map(p => `<option value="${esc(p.code)}" ${f.proposed === p.code ? "selected" : ""}>${esc(p.code)} - ${esc(p.name)}</option>`).join("")}</select></label>
    <div class="btns"><button type="button" class="btn primary" id="t-run">Run all steps</button><button type="button" class="btn" id="t-step">Step through</button><button type="button" class="btn" id="t-clear">Clear</button></div>
    <details><summary>Settings</summary>${SLIDERS.map(([k, l, a, b, st]) => `<div class="sl"><span>${l}</span><input type="range" min="${a}" max="${b}" step="${st}" value="${TS[k]}" data-set="${k}" aria-label="${l}"><output id="o-${k}">${TS[k]}</output></div>`).join("")}
      <div class="btns" style="margin-top:10px"><button type="button" class="btn" id="t-reset">Reset to trial values</button></div></details>
    ${hist.length ? `<div><div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px">Typed so far</div><div class="hist">${hist.map(r => `<button type="button" class="chip" data-hist="${esc(r.candidate.candidate_id)}" style="border-left:4px solid ${stColor(r.status)}">${esc(r.candidate.candidate_id)} - ${esc(r.candidate.name.slice(0, 28))}</button>`).join("")}</div>
      <div class="btns" style="margin-top:8px"><button type="button" class="btn" id="t-view">Open in Candidates tab</button><button type="button" class="btn" id="t-dl">Download JSON</button></div></div>` : ""}
    <p style="margin:0;font-size:12.5px;color:var(--faint)">Runs in your browser with word and word-pair vectors built from the loaded data, so scores differ a little from pgvector. For the exact pipeline run <span class="mono">python interactive.py</span>.</p>
  </form><div id="tout">${renderTryOut()}</div></div>`;
}
function bar(x, max = 1) { return `<span class="sc"><i style="width:${Math.max(2, Math.min(100, 100 * x / (max || 1))).toFixed(0)}%"></i><span class="mono">${x.toFixed(2)}</span></span>`; }
function tstep(n, title, sub, body) {
  const pend = n > S.tryStep;
  return `<section class="tstep ${pend ? "pending" : ""}" aria-label="Step ${n}"><header><span class="n">${n}</span><h3>${title}<small>${sub}</small></h3></header><div class="bd">${pend ? "" : body}</div></section>`;
}
function renderTryOut() {
  const R = S.tryRes;
  if (!R) return `<div class="empty"><b style="font-family:var(--display);font-size:18px;color:var(--ink)">Nothing run yet</b><br>Type a name and definition, then choose <b>Run all steps</b> or <b>Step through</b>.<br><span style="font-size:13px">Try: 'Bird strike on climb-out causing engine damage', or start from an existing candidate.</span></div>`;
  const { candidate: c, output: o, diag: d, trace: t } = R, w = TS.vector_weight;
  const repRow = (r, keptSet, extra = "") => `<tr class="${keptSet.has(r.x.report_key) ? "" : "out"}"><td class="mono">${esc(r.x.report_key)}</td><td>${codeChips(r.x.l1_codes, o.parent_code)}</td><td class="mono">${r.cos.toFixed(2)}</td><td class="mono">${r.kwn.toFixed(2)}</td><td>${bar(r.score, t.poolAll[0] ? t.poolAll[0].score : 1)}</td>${extra}</tr>`;
  const poolSet = new Set(d.pool.map(p => p.report_key));
  const s1 = `<div class="formula">score = ${w.toFixed(2)} x vector cosine + ${(1 - w).toFixed(2)} x keyword rank - kept if >= ${t.poolCut.toFixed(2)} (${TS.relative_cutoff} x top, floor ${TS.min_score})</div>
    <div style="font-size:13px;color:var(--muted)">Keywords used: ${t.qterms.slice(0, 18).map(x => `<span class="code">${esc(x)}</span>`).join(" ")}</div>
    <div class="tbl"><table class="minitbl"><thead><tr><th>Report</th><th>Coded</th><th>Vector</th><th>Keyword</th><th>Score</th><th>Pool</th></tr></thead><tbody>
    ${t.poolAll.map(r => repRow(r, poolSet, `<td>${poolSet.has(r.x.report_key) ? "kept" : "below cut-off"}</td>`)).join("")}</tbody></table></div>
    <p style="margin:0;font-size:13.5px;color:var(--muted)">${d.pool.length} report${d.pool.length === 1 ? "" : "s"} kept. They vote on the parent in step 2. Nothing is linked yet.</p>`;
  const mx = Math.max(...t.rows.map(r => r.score), 0.01);
  const s2 = `<div class="formula">parent score = ${TS.parent_def_weight.toFixed(2)} x definition fit + ${(1 - TS.parent_def_weight).toFixed(2)} x report vote - only in-scope CICTT codes</div>
    <div class="tbl"><table class="minitbl"><thead><tr><th>Parent</th><th>Definition fit</th><th>Report vote</th><th>Score</th></tr></thead><tbody>
    ${t.rows.slice(0, 6).map((r, i) => `<tr class="${i ? "out" : ""}"><td><span class="code" ${i ? "" : 'style="background:var(--navy);color:var(--on-navy)"'}>${esc(r.code)}</span> ${esc(r.name)}</td><td class="mono">${r.fit.toFixed(2)}</td><td class="mono">${pct(r.vote)}</td><td>${bar(r.score, mx)}</td></tr>`).join("")}</tbody></table></div>
    <div class="kv"><div>Chosen<b>${esc(o.parent_code)}</b></div><div>Agreement<b>${pct(d.parent_agreement)}</b></div><div>Margin over ${esc(d.runner_up)}<b>${d.margin.toFixed(2)}</b></div><div>Definition-fit rank<b>${d.parent_definition_rank}</b></div>${d.co_codes.length ? `<div>Co-codes<b>${esc(d.co_codes.join(", "))}</b></div>` : ""}</div>
    ${c.proposed_parent && c.proposed_parent !== o.parent_code ? `<div class="note">Discovery proposed <b>${esc(c.proposed_parent)}</b>, but the evidence points to <b>${esc(o.parent_code)}</b>. G8 will send this to review.</div>` : ""}`;
  const defSet = new Set(o.definition_ids);
  const s3 = t.defAll.length ? `<div class="formula">same hybrid score, only definitions crosswalked to ${esc(o.parent_code)} - kept if >= ${t.defCut.toFixed(2)}, at most ${TS.max_definitions}</div>
    <div class="tbl"><table class="minitbl"><thead><tr><th>Definition</th><th>Term</th><th>Score</th><th></th></tr></thead><tbody>
    ${t.defAll.map(r => `<tr class="${defSet.has(r.x.id) ? "" : "out"}"><td class="mono">${esc(r.x.id)}</td><td>${esc(r.x.term)}<br><small style="color:var(--muted)">${esc(r.x.source)}</small></td><td>${bar(r.score, t.defAll[0].score)}</td><td>${defSet.has(r.x.id) ? "linked" : "not linked"}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="note">No industry definition is crosswalked to ${esc(o.parent_code)}. G2 will block.</div>`;
  const supSet = new Set(o.supporting_reports.map(s => s.report_key));
  const s4 = `<div class="formula">same hybrid score, only reports already coded ${esc(o.parent_code)} - kept if >= ${t.supCut.toFixed(2)}, at most ${TS.max_reports} - evidence = best sentence (0.5 vector + 0.5 keyword)</div>
    <div class="reps">${d.support.map(s => { const r = S.reports[s.report_key]; return `<div class="rep"><div class="top"><span class="k">${esc(s.report_key)}</span>${codeChips(r.l1_codes, o.parent_code)}<span style="color:var(--muted)">${esc(r.phase || "")}</span><span style="color:var(--muted)">score ${s.score.toFixed(2)}</span></div><p>${highlight(r.narrative, s.evidence)}</p></div>`; }).join("") || `<div class="note">No report under ${esc(o.parent_code)} passed the cut-off.</div>`}</div>
    ${t.supAll.filter(r => !supSet.has(r.x.report_key)).length ? `<p style="margin:0;font-size:13px;color:var(--muted)">Below the cut-off: ${t.supAll.filter(r => !supSet.has(r.x.report_key)).map(r => `${esc(r.x.report_key)} (${r.score.toFixed(2)})`).join(", ")}</p>` : ""}`;
  const icon = ch => ch.passed ? `<span class="ic p">Y</span>` : ch.severity === "block" ? `<span class="ic b">X</span>` : `<span class="ic r">!</span>`;
  const s5 = `<ul class="checks">${R.checks.map(ch => `<li>${icon(ch)}<span class="cid">${ch.id}</span><span>${esc(ch.name)}<small>${esc(ch.detail)}${ch.passed ? "" : ch.severity === "block" ? " - blocks grounding" : " - sends to SME review"}</small></span></li>`).join("")}</ul>`;
  const verdict = S.tryStep >= 5 ? `<div class="verdict ${R.status}"><span class="big" style="color:${stColor(R.status)}">${STATUS_LABEL[R.status]}</span><span>${esc(c.name)} -> <span class="code">${esc(o.parent_code)}</span> - ${o.definition_ids.length} definition${o.definition_ids.length === 1 ? "" : "s"} - ${o.supporting_reports.length} report${o.supporting_reports.length === 1 ? "" : "s"}</span><span class="spacer"></span><a class="btn" href="#cand-${esc(c.candidate_id)}" id="t-open">See the full chain</a></div>` : "";
  const next = S.tryStep < 5 ? `<div class="btns" style="display:flex;gap:8px"><button type="button" class="btn primary" id="t-next">Next step (${S.tryStep + 1} of 5)</button><button type="button" class="btn" id="t-all">Show all</button></div>` : "";
  return `<div class="tsteps"><div class="dhead"><div class="eyebrow"><span class="mono">${esc(c.candidate_id)}</span> typed candidate</div><h1>${esc(c.name)}</h1><p>${esc(c.definition)}</p></div>
    ${tstep(1, "Retrieve", "Find the reports closest to the candidate, with no parent filter", s1)}
    ${tstep(2, "Choose the ICAO parent", "Blend how well each parent's definition fits with how the closest reports are coded", s2)}
    ${tstep(3, "Link industry definitions", `Only definitions crosswalked to ${esc(o.parent_code)} can be chosen`, s3)}
    ${tstep(4, "Find supporting reports", `Only reports already coded ${esc(o.parent_code)}, each with a sentence quoted word for word`, s4)}
    ${tstep(5, "Verify", "Deterministic checks G1-G8 decide the status", s5)}
    ${next}${verdict}</div>`;
}
function tryRun(stepMode) {
  const f = S.tryForm;
  if (!f.name.trim()) { toast("Type a candidate name first."); document.getElementById("t-name").focus(); return; }
  if (!Object.keys(S.reports).length || !Object.keys(S.defs).length) { toast("Load reports and definitions first."); return; }
  if (!S.runs.manual) S.runs.manual = { run_id: "typed-" + new Date().toISOString().slice(0, 19).replace(/[-:T]/g, ""), mode: "manual", embedder: "browser tf-idf", dims: "sparse", results: [], manual: true };
  const sameAsLast = S.tryRes && S.tryRes.candidate.name === f.name.trim() && S.tryRes.candidate.definition === (f.definition.trim() || f.name.trim()) && S.tryRes.candidate.proposed_parent === f.proposed;
  let cid = sameAsLast ? S.tryRes.candidate.candidate_id : null;
  if (!cid) { const used = new Set(S.runs.manual.results.map(r => r.candidate.candidate_id)); do { cid = "M" + String(++S.tryN).padStart(2, "0"); } while (used.has(cid)); }
  S.tryRes = groundTyped(f.name.trim(), f.definition.trim() || f.name.trim(), f.proposed, cid);
  const m = S.runs.manual, i = m.results.findIndex(r => r.candidate.candidate_id === cid);
  if (i >= 0) m.results[i] = S.tryRes; else m.results.push(S.tryRes);
  m.summary = { mode: "manual", candidates: m.results.length, status: Object.fromEntries(["grounded", "needs_review", "not_grounded"].map(s => [s, m.results.filter(r => r.status === s).length])) };
  m.settings = Object.assign({}, TS);
  S.tryStep = stepMode ? 1 : 5;
  render();
  const out = document.getElementById("tout"); if (out && window.innerWidth < 980) out.scrollIntoView({ behavior: "smooth" });
}
function wireTry() {
  const f = S.tryForm, $ = id => document.getElementById(id);
  $("t-name").addEventListener("input", e => (f.name = e.target.value));
  $("t-def").addEventListener("input", e => (f.definition = e.target.value));
  $("t-prop").addEventListener("change", e => (f.proposed = e.target.value));
  $("t-name").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); tryRun(false); } });
  $("t-def").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) tryRun(false); });
  $("t-run").addEventListener("click", () => tryRun(false));
  $("t-step").addEventListener("click", () => tryRun(true));
  $("t-clear").addEventListener("click", () => { S.tryForm = { name: "", definition: "", proposed: "" }; S.tryRes = null; render(); });
  const cp = $("t-copy"); if (cp) cp.addEventListener("change", () => { const src = (S.runs.rules || S.runs.llm).results.find(r => r.candidate.candidate_id === cp.value); if (!src) return;
    S.tryForm = { name: src.candidate.name, definition: src.candidate.definition, proposed: src.candidate.proposed_parent || "" }; S.tryRes = null; render(); toast(`Copied ${src.candidate.candidate_id}. Its pipeline result: ${src.output.parent_code}, ${STATUS_LABEL[src.status]}.`); });
  document.querySelectorAll("[data-set]").forEach(sl => sl.addEventListener("input", () => {
    const k = sl.dataset.set; TS[k] = +sl.value; $("o-" + k).textContent = sl.value;
    if (S.tryRes) { const c = S.tryRes.candidate; const keep = S.tryStep; S.tryRes = groundTyped(c.name, c.definition, c.proposed_parent, c.candidate_id); S.tryStep = keep;
      const m = S.runs.manual, i = m.results.findIndex(r => r.candidate.candidate_id === c.candidate_id); if (i >= 0) m.results[i] = S.tryRes;
      $("tout").innerHTML = renderTryOut(); wireTryOut(); } }));
  $("t-reset").addEventListener("click", () => { Object.assign(TS, TRY_DEFAULTS); if (S.tryRes) { const c = S.tryRes.candidate; S.tryRes = groundTyped(c.name, c.definition, c.proposed_parent, c.candidate_id); } render(); });
  document.querySelectorAll("[data-hist]").forEach(b => b.addEventListener("click", () => { const r = S.runs.manual.results.find(x => x.candidate.candidate_id === b.dataset.hist);
    S.tryRes = r; S.tryStep = 5; S.tryForm = { name: r.candidate.name, definition: r.candidate.definition, proposed: r.candidate.proposed_parent }; render(); }));
  const v = $("t-view"); if (v) v.addEventListener("click", () => { S.mode = "manual"; location.hash = "candidates"; });
  const dl = $("t-dl"); if (dl) dl.addEventListener("click", () => {
    const m = S.runs.manual, clean = Object.assign({}, m, { results: m.results.map(({ trace, ...r }) => r) });
    saveFile("manual_results.json", JSON.stringify(clean, null, 1)); });
  wireTryOut();
}
/* Published page: save through the downloads capability. Opened as a local file: plain browser download. */
let DL = null;
if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => { DL = d; }).catch(() => {});
async function saveFile(filename, data) {
  if (DL) {
    try { await DL.save({ filename, data }); toast("Saved " + filename); }
    catch (e) { if (e && e.code === "rate_limited") toast("A save prompt is already open."); else if (!(e && e.code === "declined")) toast("Download is not available here."); }
    return;
  }
  if (window.claude) { toast("Download is not available in this view."); return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); }
  catch (e) { toast("Download is not available here."); }
}
function wireTryOut() {
  const $ = id => document.getElementById(id);
  const nx = $("t-next"); if (nx) nx.addEventListener("click", () => { S.tryStep++; $("tout").innerHTML = renderTryOut(); wireTryOut(); const st = document.querySelectorAll(".tstep")[S.tryStep - 1]; if (st) st.scrollIntoView({ behavior: "smooth", block: "start" }); });
  const al = $("t-all"); if (al) al.addEventListener("click", () => { S.tryStep = 5; $("tout").innerHTML = renderTryOut(); wireTryOut(); });
  const op = $("t-open"); if (op) op.addEventListener("click", () => { S.mode = "manual"; });
}

/* ---------------- routing + events ---------------- */
function currentTab() { const h = (location.hash || "#candidates").slice(1); if (h.startsWith("cand-")) { S.cand = h.slice(5); return "candidates"; } return ["candidates", "try", "matrix", "compare", "guardrails", "parents", "data", "method"].includes(h) ? h : "candidates"; }
function render() {
  renderSummary();
  const tab = currentTab();
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === tab ? "page" : "false"));
  const v = document.getElementById("view");
  if (tab === "try") { v.innerHTML = renderTry(); wireTry(); wire(); return; }
  v.innerHTML = run() ? ({ candidates: renderCandidates, matrix: renderMatrix, compare: renderCompare, guardrails: renderGuardrails, parents: renderParents, data: renderData, method: renderMethod }[tab])() : renderMethod();
  wire();
}
function wire() {
  document.querySelectorAll("[data-cand]").forEach(b => b.addEventListener("click", () => { location.hash = "cand-" + b.dataset.cand; }));
  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { S.filter = b.dataset.filter; render(); }));
  const cq = document.getElementById("cq"); if (cq) cq.addEventListener("input", () => { S.q = cq.value; const pos = cq.selectionStart; render(); const n = document.getElementById("cq"); n.focus(); n.setSelectionRange(pos, pos); });
  document.querySelectorAll("[data-open]").forEach(r => { const go = () => { location.hash = "cand-" + r.dataset.open; }; r.addEventListener("click", go); r.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); });
  document.querySelectorAll(".nodehit").forEach(g => g.addEventListener("click", () => { const t = document.getElementById(g.dataset.jump); if (!t) return; t.scrollIntoView({ behavior: "smooth", block: "center" }); t.classList.add("focus"); setTimeout(() => t.classList.remove("focus"), 1600); }));
  document.querySelectorAll("[data-dtab]").forEach(b => b.addEventListener("click", () => { S.dataTab = b.dataset.dtab; render(); }));
  const dq = document.getElementById("dq"); if (dq) dq.addEventListener("input", () => { S.dataQ = dq.value; const pos = dq.selectionStart; render(); const n = document.getElementById("dq"); n.focus(); n.setSelectionRange(pos, pos); });
  const dc = document.getElementById("dcode"); if (dc) dc.addEventListener("change", () => { S.dataCode = dc.value; render(); });
  const lb2 = document.getElementById("loadbtn2"); if (lb2) lb2.addEventListener("click", () => document.getElementById("files").click());
  const drop = document.getElementById("drop");
  if (drop) { drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); }); drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); loadFiles([...e.dataTransfer.files]); }); }
}
document.getElementById("m-rules").addEventListener("click", () => { S.mode = "rules"; store("mode", "rules"); render(); });
document.getElementById("m-llm").addEventListener("click", () => { S.mode = "llm"; store("mode", "llm"); render(); });
document.getElementById("m-man").addEventListener("click", () => { S.mode = "manual"; render(); });
document.getElementById("loadbtn").addEventListener("click", () => document.getElementById("files").click());
document.getElementById("files").addEventListener("change", e => { loadFiles([...e.target.files]); e.target.value = ""; });
window.addEventListener("hashchange", () => { render(); window.scrollTo({ top: 0 }); });
if (recall("mode") === "llm") S.mode = "llm";
render();
</script>
