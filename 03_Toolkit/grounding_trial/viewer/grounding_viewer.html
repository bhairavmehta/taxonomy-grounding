<style>
/* Layout: sticky bar (brand, run switch, load files) -> summary strip -> tabs. Candidates tab = list left, chain + evidence right. */
:root {
  --bg: #F5F7FA; --surface: #FFFFFF; --sunk: #EDF1F6; --line: #D7DEE7;
  --ink: #17233A; --muted: #56647A; --faint: #8592A5;
  --navy: #1F3864; --navy-soft: #E6ECF6; --on-navy: #FFFFFF;
  --teal: #0E7C7B; --teal-soft: #E1F1F0;
  --ok: #2E7D32; --ok-soft: #E7F3E7;
  --warn: #B95A0C; --warn-soft: #FCEFE0;
  --bad: #B3261E; --bad-soft: #FBE8E6;
  --mark: #FFE7A3; --mark-ink: #3A2A00;
  --focus: #2F6FDB;
  --display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1520; --surface: #161E2C; --sunk: #1C2636; --line: #2B374A;
  --ink: #E7ECF4; --muted: #A4B1C4; --faint: #75839A;
  --navy: #3A5FA0; --navy-soft: #1D2A42; --on-navy: #FFFFFF;
  --teal: #29A3A1; --teal-soft: #13302F;
  --ok: #4CAF50; --ok-soft: #16301A;
  --warn: #E5913F; --warn-soft: #36260F;
  --bad: #EF6A5F; --bad-soft: #3A1A17;
  --mark: #6B5414; --mark-ink: #FFF3CC;
  --focus: #8FB3F3; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1520; --surface: #161E2C; --sunk: #1C2636; --line: #2B374A;
  --ink: #E7ECF4; --muted: #A4B1C4; --faint: #75839A;
  --navy: #3A5FA0; --navy-soft: #1D2A42; --on-navy: #FFFFFF;
  --teal: #29A3A1; --teal-soft: #13302F;
  --ok: #4CAF50; --ok-soft: #16301A;
  --warn: #E5913F; --warn-soft: #36260F;
  --bad: #EF6A5F; --bad-soft: #3A1A17;
  --mark: #6B5414; --mark-ink: #FFF3CC;
  --focus: #8FB3F3; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrapx { max-width: 1360px; margin: 0 auto; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; }
.bar .wrapx { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .02em; }
.brand small { display: block; font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--sunk); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); font-weight: 600; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--navy); }
.btn.primary { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }

/* summary */
.summary { padding-block: 18px 6px; }
.tiles { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.tile .k { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.tile .v { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 13px; color: var(--muted); }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 8px 0 6px; background: var(--sunk); }
.stack i { display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.runline { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; gap: 6px 18px; flex-wrap: wrap; }
.runline code { font-family: var(--mono); font-size: 12px; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 14px; overflow-x: auto; }
.tabs a { text-decoration: none; color: var(--muted); padding: 10px 14px; font-family: var(--display); font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--navy); }
main { padding-block: 18px 48px; }

/* candidates */
.cgrid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.list { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 100px); overflow: auto; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list input[type="search"] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.citem { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; border-left: 4px solid var(--line); }
.citem:hover { border-color: var(--navy); }
.citem[aria-current="true"] { box-shadow: 0 0 0 2px var(--navy) inset; }
.citem .id { font-family: var(--mono); font-size: 12px; color: var(--muted); grid-row: span 2; padding-top: 2px; }
.citem .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
.citem .mt { font-size: 12.5px; color: var(--muted); }
.st-grounded { border-left-color: var(--ok) !important; } .st-needs_review { border-left-color: var(--warn) !important; } .st-not_grounded { border-left-color: var(--bad) !important; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill.grounded { background: var(--ok-soft); color: var(--ok); } .pill.needs_review { background: var(--warn-soft); color: var(--warn); } .pill.not_grounded { background: var(--bad-soft); color: var(--bad); }
.code { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--navy-soft); }

.detail { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.dhead h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3vw, 32px); line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; }
.dhead .eyebrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dhead p { margin: 0; color: var(--muted); max-width: 75ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel > h2 { font-family: var(--display); font-weight: 700; font-size: 13.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.panel > h2 span { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; color: var(--faint); }
.chainwrap { overflow-x: auto; }
.chainwrap svg { display: block; min-width: 760px; width: 100%; height: auto; }
svg text { font-family: var(--body); }
.nodehit { cursor: pointer; }
.nodehit:hover rect { stroke-width: 2.4; }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 26px 34px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; }
.ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #FFFFFF; font-weight: 700; font-size: 13px; }
.ic.p { background: var(--ok); } .ic.r { background: var(--warn); } .ic.b { background: var(--bad); }
.checks .cid { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding-top: 2px; }
.checks small { display: block; color: var(--muted); font-size: 12.5px; }
.bars { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 52px; gap: 10px; align-items: center; font-size: 13.5px; }
.brow .track { height: 14px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.brow .fill { height: 100%; background: var(--faint); border-radius: 4px; }
.brow.win .fill { background: var(--navy); }
.brow .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
.kv div { background: var(--sunk); border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.kv b { display: block; font-family: var(--display); font-size: 18px; font-variant-numeric: tabular-nums; }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 9px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
.note.info { border-left-color: var(--teal); background: var(--teal-soft); }
.defs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.def { border: 1px solid var(--line); border-top: 3px solid var(--teal); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.def .t { font-weight: 600; }
.def .src { font-size: 12.5px; color: var(--muted); font-style: italic; }
.def .x { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.rep { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; scroll-margin-top: 90px; }
.rep.focus { box-shadow: 0 0 0 2px var(--focus); }
.rep .top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.rep .top .k { font-family: var(--mono); font-weight: 500; font-size: 12.5px; }
.rep p { margin: 0; font-size: 14.5px; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 3px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 99px; font-weight: 600; }
.badge.tp { background: var(--ok-soft); color: var(--ok); } .badge.fp { background: var(--bad-soft); color: var(--bad); } .badge.fn { background: var(--warn-soft); color: var(--warn); }
.codes { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.reps { display: grid; gap: 10px; }
.diff { display: grid; gap: 6px; font-size: 14px; }
.diff div { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px; }
.diff b { font-weight: 600; }

/* matrix + tables */
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-family: var(--display); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.c { text-align: center; }
tr.clk { cursor: pointer; } tr.clk:hover td { background: var(--sunk); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.sec h2 { font-family: var(--display); font-size: 20px; margin: 0 0 6px; }
.sec p.lead { color: var(--muted); max-width: 80ch; margin: 0 0 14px; }
.sec + .sec { margin-top: 28px; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.row input, .row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step3 { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.step3 h3 { margin: 0; padding: 10px 14px; font-family: var(--display); font-size: 16px; color: var(--on-navy); }
.step3 ul { margin: 0; padding: 10px 14px 12px 30px; font-size: 14px; }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--muted); background: var(--surface); }
.drop.over { border-color: var(--navy); background: var(--navy-soft); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: 420px; }

/* try-a-candidate */
.tgrid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
.tform { position: sticky; top: 74px; display: grid; gap: 12px; }
.tform label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tform input, .tform textarea, .tform select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 400; color: var(--ink); }
.tform textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
.tform .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tform details { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 12px; }
.tform summary { cursor: pointer; font-size: 13.5px; font-weight: 600; }
.sl { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 2px 10px; align-items: center; font-size: 13px; margin-top: 8px; }
.sl span { grid-column: 1 / -1; color: var(--muted); }
.sl output { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
.sl input { width: 100%; accent-color: var(--navy); }
.hist { display: flex; gap: 6px; flex-wrap: wrap; }
.tsteps { display: grid; gap: 14px; }
.tstep { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; animation: rise .35s ease both; }
.tstep > header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); }
.tstep .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--on-navy); font-family: var(--display); font-weight: 700; flex: none; }
.tstep h3 { margin: 0; font-family: var(--display); font-size: 17px; }
.tstep h3 small { display: block; font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }
.tstep .bd { padding: 12px 14px; display: grid; gap: 10px; }
.tstep.pending { opacity: .5; animation: none; }
.tstep.pending .bd { display: none; }
.minitbl td, .minitbl th { padding: 6px 10px; font-size: 13.5px; }
.minitbl tr.out td { color: var(--faint); }
.minitbl .sc { display: grid; grid-template-columns: minmax(60px, 1fr) 40px; gap: 6px; align-items: center; }
.minitbl .sc i { display: block; height: 8px; border-radius: 4px; background: var(--navy); }
.minitbl tr.out .sc i { background: var(--faint); }
.verdict { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.verdict.grounded { border-left: 6px solid var(--ok); } .verdict.needs_review { border-left: 6px solid var(--warn); } .verdict.not_grounded { border-left: 6px solid var(--bad); }
.verdict .big { font-family: var(--display); font-weight: 700; font-size: 22px; }
.formula { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--sunk); border-radius: 6px; padding: 6px 9px; }
.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); background: var(--surface); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (max-width: 980px) {
  .tgrid { grid-template-columns: minmax(0, 1fr); } .tform { position: static; }
  .cgrid { grid-template-columns: minmax(0, 1fr); }
  .list { position: static; max-height: none; }
  .two { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile .v { font-size: 22px; } .tile .k { font-size: 11px; letter-spacing: .06em; }
  .tiles .tile:first-child { grid-column: 1 / -1; }
  .steps3 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

iway Bravo, believing it was the runway. The takeoff was abandoned when they saw the blue taxiway edge lights."},{"report_key":"SAMPLE-005","source_id":"SAMPLE","phase":"Landing","l1_codes":["RI","NAV"],"source_codes":"Deviation: Track or Heading; Other: Wrong Airport","narrative":"The crew landed at a nearby general aviation airport with a similar runway alignment instead of the destination airport. The error was found after landing."},{"report_key":"SAMPLE-006","source_id":"SAMPLE","phase":"Taxi","l1_codes":["RI","ATM"],"source_codes":"Ground Incursion: Runway","narrative":"Taxiing to Runway 16, the crew crossed the hold-short line for Runway 22 without a clearance while another aircraft was on its takeoff roll. ATC cancelled the takeoff clearance."},{"report_key":"SAMPLE-007","source_id":"SAMPLE","phase":"Taxi","l1_codes":["RI"],"source_codes":"Ground Incursion: Runway; Deviation: Clearance","narrative":"A readback error led the crew to hear cross Runway 9 instead of hold short of Runway 9, and the aircraft entered the active runway without a clearance."},{"report_key":"SAMPLE-008","source_id":"SAMPLE","phase":"Taxi","l1_codes":["RI"],"source_codes":"Ground Incursion: Runway","narrative":"A snow removal vehicle entered the active runway without a clearance during clearing operations. Landing traffic was sent around."},{"report_key":"SAMPLE-009","source_id":"SAMPLE","phase":"Taxi","l1_codes":["RI"],"source_codes":"Ground Incursion: Runway","narrative":"The stop bar lights were on, but the crew continued past the holding point onto the runway after mistaking a frequency change for a crossing clearance."},{"report_key":"SAMPLE-010","source_id":"SAMPLE","phase":"Landing","l1_codes":["RE"],"source_codes":"Ground Excursion: Runway","narrative":"The aircraft landed long on a wet runway with a tailwind. Braking action was poor and the aircraft overran the runway end by 60 metres into the runway end safety area."},{"report_key":"SAMPLE-011","source_id":"SAMPLE","phase":"Landing","l1_codes":["RE"],"source_codes":"Ground Excursion: Runway; Inflight Event: Unstabilized Approach","narrative":"After an unstabilized, fast approach the aircraft touched down 2,500 feet beyond the threshold on a runway reported with standing water and came to a stop in the overrun area."},{"report_key":"SAMPLE-012","source_id":"SAMPLE","phase":"Landing","l1_codes":["RE","ICE"],"source_codes":"Ground Excursion: Runway","narrative":"The runway condition code was reported as 2 after freezing rain. The crew did not recompute the landing distance and the aircraft overran onto the grass beyond the runway end."},{"report_key":"SAMPLE-013","source_id":"SAMPLE","phase":"Landing","l1_codes":["RE","SCF-PP"],"source_codes":"Ground Excursion: Runway; Equipment Problem","narrative":"With one thrust reverser unavailable, a long landing on a contaminated runway ended in a low-speed overrun past the runway end."},{"report_key":"SAMPLE-014","source_id":"SAMPLE","phase":"Landing","l1_codes":["RE"],"source_codes":"Ground Excursion: Runway","narrative":"In a strong, gusty crosswind the aircraft veered off the left side of the runway during the landing roll."},{"report_key":"SAMPLE-015","source_id":"SAMPLE","phase":"Climb","l1_codes":["LOC-I","ICE"],"source_codes":"Inflight Event: Loss of Aircraft Control; Equipment Problem","narrative":"Climbing through FL280 in icing conditions, the captain and first officer airspeed indications disagreed. The autopilot disconnected and the aircraft reached a stall warning before the crew recovered."},{"report_key":"SAMPLE-016","source_id":"SAMPLE","phase":"Climb","l1_codes":["SCF-NP"],"source_codes":"Equipment Problem: Air Data","narrative":"After takeoff an airspeed disagree alert appeared. The crew used the unreliable airspeed checklist, flew pitch and power, and returned to the departure airport without further problems."},{"report_key":"SAMPLE-017","source_id":"SAMPLE","phase":"Cruise","l1_codes":["LOC-I","SCF-NP"],"source_codes":"Inflight Event: Loss of Aircraft Control; Equipment Problem","narrative":"A pitot heat failure at cruise produced a falling airspeed indication. The crew pitched down in response, reached an overspeed and lost significant altitude before recovering."},{"report_key":"SAMPLE-018","source_id":"SAMPLE","phase":"Cruise","l1_codes":["LOC-I","ICE"],"source_codes":"Inflight Event: Loss of Aircraft Control","narrative":"Ice crystals caused unreliable airspeed indications. The stick shaker activated and the aircraft descended 3,000 feet during the upset before control was regained."},{"report_key":"SAMPLE-019","source_id":"SAMPLE","phase":"Climb","l1_codes":["MAC"],"source_codes":"Deviation: Altitude; Conflict: Airborne Conflict","narrative":"The climbing aircraft overshot its cleared altitude of FL240 by 400 feet, and opposite-direction traffic received a TCAS resolution advisory to descend."},{"report_key":"SAMPLE-020","source_id":"SAMPLE","phase":"Cruise","l1_codes":["MAC"],"source_codes":"Deviation: Altitude; Conflict: Airborne Conflict","narrative":"Autopilot mode confusion caused an altitude deviation, and the crew received a TCAS resolution advisory for traffic 600 feet below."},{"report_key":"SAMPLE-021","source_id":"SAMPLE","phase":"Climb","l1_codes":["MAC","ATM"],"source_codes":"Deviation: Altitude; Conflict: Airborne Conflict","narrative":"On departure the crew set the wrong altitude in the mode control panel. The resulting level bust triggered a TCAS climb resolution advisory and separation was lost."},{"report_key":"SAMPLE-022","source_id":"SAMPLE","phase":"Descent","l1_codes":["MAC","ATM"],"source_codes":"Conflict: Airborne Conflict; ATC Issue","narrative":"The controller issued a descent clearance into conflicting traffic and both aircraft received TCAS resolution advisories."},{"report_key":"SAMPLE-023","source_id":"SAMPLE","phase":"Cruise","l1_codes":["TURB","CABIN"],"source_codes":"Inflight Event: Turbulence; Injury","narrative":"The aircraft encountered severe clear-air turbulence at FL350 with no weather shown on radar. Two flight attendants in the aft galley were injured."},{"report_key":"SAMPLE-024","source_id":"SAMPLE","phase":"Cruise","l1_codes":["TURB","CABIN"],"source_codes":"Inflight Event: Turbulence; Injury","narrative":"Unforecast turbulence near the jet stream occurred just after the seat belt sign was turned off. A passenger standing in the aisle broke an ankle."},{"report_key":"SAMPLE-025","source_id":"SAMPLE","phase":"Cruise","l1_codes":["TURB","CABIN"],"source_codes":"Inflight Event: Turbulence; Injury","narrative":"Moderate to severe clear-air turbulence over the mountains caught the cabin with carts not secured, and a flight attendant was struck by a cart."},{"report_key":"SAMPLE-026","source_id":"SAMPLE","phase":"Cruise","l1_codes":["TURB","CABIN"],"source_codes":"Inflight Event: Turbulence; Injury","narrative":"Only light chop was expected, but the aircraft met sudden severe turbulence in clear air. Three passengers who were not wearing seat belts were injured."},{"report_key":"SAMPLE-027","source_id":"SAMPLE","phase":"Approach","l1_codes":["TURB"],"source_codes":"Inflight Event: Wake Vortex Encounter","narrative":"Wake turbulence from a heavy aircraft on final approach caused a sudden 30-degree roll. The crew recovered and there were no injuries."},{"report_key":"SAMPLE-028","source_id":"SAMPLE","phase":"Climb","l1_codes":["SCF-PP","BIRD"],"source_codes":"Inflight Event: Bird Strike; Equipment Problem: Engine","narrative":"A flock of geese was ingested into the left engine at 800 feet after takeoff. The engine vibrated and lost thrust, and the crew shut it down and returned."},{"report_key":"SAMPLE-029","source_id":"SAMPLE","phase":"Takeoff","l1_codes":["SCF-PP","BIRD"],"source_codes":"Inflight Event: Bird Strike; Equipment Problem: Engine","narrative":"Multiple bird strikes during the takeoff roll caused the right engine to surge, and the crew rejected the takeoff."},{"report_key":"SAMPLE-030","source_id":"SAMPLE","phase":"Approach","l1_codes":["BIRD"],"source_codes":"Inflight Event: Bird Strike","narrative":"A bird strike on approach was found on the post-flight inspection, with dents on the radome. There was no indication in flight."},{"report_key":"SAMPLE-031","source_id":"SAMPLE","phase":"Climb","l1_codes":["SCF-PP","BIRD"],"source_codes":"Inflight Event: Bird Strike; Equipment Problem: Engine","narrative":"After ingesting a large bird at 3,000 feet the crew received an engine fire warning, shut the engine down and discharged the fire extinguisher."},{"report_key":"SAMPLE-032","source_id":"SAMPLE","phase":"Ground","l1_codes":["ICE"],"source_codes":"Ground Event: De-icing","narrative":"The takeoff was delayed beyond the de-icing fluid holdover time, and the crew returned to the pad for a second de-icing."},{"report_key":"SAMPLE-033","source_id":"SAMPLE","phase":"Approach","l1_codes":["CFIT"],"source_codes":"Inflight Event: Terrain Warning","narrative":"During a non-precision approach at night the crew received a GPWS terrain warning, climbed and went around."},{"report_key":"SAMPLE-034","source_id":"SAMPLE","phase":"Landing","l1_codes":["ARC"],"source_codes":"Ground Event: Hard Landing","narrative":"A late flare in gusty winds led to a hard landing and a tail strike."},{"report_key":"SAMPLE-035","source_id":"SAMPLE","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"Ground Event: Tail Strike","narrative":"An incorrect takeoff weight in the flight management computer led to early rotation and a tail strike on takeoff."},{"report_key":"SAMPLE-036","source_id":"SAMPLE","phase":"Landing","l1_codes":["ARC"],"source_codes":"Ground Event: Hard Landing","narrative":"A bounced landing was followed by a hard second touchdown that damaged the nose landing gear."},{"report_key":"SYNB-060","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the B737 MAX 8 to descend into conflicting traffic at FL310. Separation was lost. The sector was very busy.","_truth":"B07"},{"report_key":"SYNB-072","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL280 the A hydraulic system quantity dropped to zero. We ran the hydraulic loss checklist and returned to the departure airport. The gear was extended by gravity.","_truth":"B09"},{"report_key":"SYNB-074","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL240 the green hydraulic system quantity dropped to zero. The flight crew ran the hydraulic loss checklist and diverted. Landing distance was longer because of reduced braking.","_truth":"B09"},{"report_key":"SYNB-118","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["BIRD","SCF-PP"],"source_codes":"","narrative":"Passing 1,500 feet after takeoff from a coastal airport, the E175 flew through a flock of starlings. The left engine showed high vibration after ingesting birds. The captain and first officer declared an emergency and landed overweight. The engine was replaced.","_truth":"B15"},{"report_key":"SYNB-021","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"Landing on Runway 31L with a crosswind near the limit, the B767-300F drifted toward the edge. The aircraft veered off the right side of the runway and stopped on the grass. The nose gear was damaged.","_truth":"B03"},{"report_key":"SYNB-234","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["BIRD"],"source_codes":"","narrative":"A bird struck the left wing leading edge during the approach. No damage was found on inspection.","_truth":"background"},{"report_key":"SYNB-012","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["RI"],"source_codes":"","narrative":"The crew lined up on taxiway Echo in darkness, mistaking its lights for Runway 18R. The aircraft landed on the taxiway, which was clear of traffic. The approach lighting for the assigned runway was set to a low intensity.","_truth":"B02"},{"report_key":"SYNB-191","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["ICE"],"source_codes":"","narrative":"Holding at 10,000 ft in supercooled cloud, ice built up on the wings faster than expected. Airspeed decayed and more power was needed. The flight crew increased the approach speed.","_truth":"B25"},{"report_key":"SYNB-076","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL350 the left hydraulic system quantity dropped to zero. The captain and first officer ran the hydraulic loss checklist and continued to the destination. Landing distance was longer because of reduced braking.","_truth":"B09"},{"report_key":"SYNB-083","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["SCF-NP"],"source_codes":"","narrative":"On approach the left main gear showed unsafe with no green light. The alternate gear extension did not lock the gear. A tower flyby confirmed the gear position.","_truth":"B10"},{"report_key":"SYNB-261","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RE"],"source_codes":"","narrative":"A rejected takeoff at 125 knots was carried out for a master caution. The aircraft stopped on the runway with hot brakes.","_truth":"background"},{"report_key":"SYNB-070","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL210 the B hydraulic system quantity dropped to zero. The crew ran the hydraulic loss checklist and returned to the departure airport. The gear was extended by gravity.","_truth":"B09"},{"report_key":"SYNB-025","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"Landing on Runway 18R with a crosswind near the limit, the A330-300 drifted toward the edge. The aircraft veered off the right side of the runway and stopped on the grass. The runway was closed for two hours.","_truth":"B03"},{"report_key":"SYNB-146","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["FUEL"],"source_codes":"","narrative":"After two missed approaches in clear conditions, fuel dropped toward final reserve. The crew declared minimum fuel and received priority. The aircraft landed with 900 kg remaining, just above final reserve.","_truth":"B19"},{"report_key":"SYNB-022","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"Landing on Runway 04R in strong gusts from the left, the E175 drifted toward the edge. The aircraft veered off the right side of the runway before returning to the pavement. The nose gear was damaged.","_truth":"B03"},{"report_key":"SYNB-198","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"In cruise at FL350 the captain's and first officer's airspeeds disagreed by 60 knots. The autopilot disconnected and the crew flew pitch and power. A wasp nest was found in a pitot probe.","_truth":"B26"},{"report_key":"SYNB-069","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL210 the green hydraulic system quantity dropped to zero. The crew ran the hydraulic loss checklist and continued to the destination. The gear was extended by gravity.","_truth":"B09"},{"report_key":"SYNB-259","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["FUEL"],"source_codes":"","narrative":"A fuel imbalance of 900 kg developed during cruise. The crew followed the fuel imbalance checklist and found no leak.","_truth":"background"},{"report_key":"SYNB-253","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["NAV"],"source_codes":"","narrative":"The FMS lost its navigation database during preflight and had to be reloaded. The departure was delayed by 40 minutes.","_truth":"background"},{"report_key":"SYNB-129","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","CABIN"],"source_codes":"","narrative":"A passenger's power bank overheated after being crushed in a seat mechanism. Cabin crew cooled the device with water. Two passengers were treated for smoke inhalation.","_truth":"B17"},{"report_key":"SYNB-113","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["BIRD","SCF-PP"],"source_codes":"","narrative":"Passing 800 feet after takeoff from a coastal airport, the A321neo flew through a flock of geese. The right engine showed high vibration after ingesting birds. The crew shut the engine down and returned. Bird remains were found in the engine core.","_truth":"B15"},{"report_key":"SYNB-236","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["CABIN"],"source_codes":"","narrative":"A passenger fainted during cruise. Cabin crew provided first aid and medical services met the aircraft.","_truth":"background"},{"report_key":"SYNB-175","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["WSTRW"],"source_codes":"","narrative":"On short final in gusty conditions the airspeed dropped by 25 knots. The predictive windshear warning sounded and the captain and first officer flew the windshear escape manoeuvre. The aircraft lost 300 feet before climbing.","_truth":"B23"},{"report_key":"SYNB-096","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["NAV"],"source_codes":"","narrative":"Over the eastern Mediterranean both GPS receivers reported a different time. ATC provided radar vectors. The position errors stopped after 20 minutes.","_truth":"B12"},{"report_key":"SYNB-184","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["USOS"],"source_codes":"","narrative":"On a visual approach at night the E175 touched down on the approach lights short of the threshold of Runway 34L. A black-hole illusion made the approach look high. The main gear was damaged.","_truth":"B24"},{"report_key":"SYNB-044","source_id":"SYNTHETIC-B","phase":"Go-around","l1_codes":["LOC-I"],"source_codes":"","narrative":"The CAPT and FO initiated a go-around at 1,000 ft in light rain. With full thrust the pitch rose to 28 degrees and the speed decayed until the stick shaker activated. The CAPT lowered the nose and recovered.","_truth":"B05"},{"report_key":"SYNB-023","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"Landing on Rwy 16 with a 30-knot gusting crosswind, the B787-9 drifted toward the edge. The aircraft veered off the left side of the rwy and stopped on the grass. The rwy was closed for two hours.","_truth":"B03"},{"report_key":"SYNB-172","source_id":"SYNTHETIC-B","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"","narrative":"During rotation on Rwy 22 the tail of the B787-9 struck the rwy. The takeoff speeds had been computed with the wrong weight. We did not pressurize and returned.","_truth":"B22"},{"report_key":"SYNB-159","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A aggressive passenger refused to follow crew instructions during the flight. Cabin crew restrained the passenger with help from others. The aircraft diverted to offload the passenger.","_truth":"B21"},{"report_key":"SYNB-195","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"During the takeoff roll the captain's and first officer's airspeeds disagreed by 40 knots. An IAS DISAGREE alert appeared and the flight crew flew pitch and power. A wasp nest was found in a pitot probe.","_truth":"B26"},{"report_key":"SYNB-272","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["WSTRW"],"source_codes":"","narrative":"A windshear alert was broadcast by the tower for Rwy 16. The approach was flown to the other rwy without problems.","_truth":"background"},{"report_key":"SYNB-256","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["CABIN"],"source_codes":"","narrative":"A passenger had a seizure during cruise. Cabin crew provided first aid and medical services met the aircraft.","_truth":"background"},{"report_key":"SYNB-089","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["CFIT"],"source_codes":"","narrative":"Flying a RNAV approach late in the evening in clear conditions, the aircraft descended below the minimum altitude. The terrain awareness system called TOO LOW TERRAIN and the crew climbed away. The final approach fix was misidentified.","_truth":"B11"},{"report_key":"SYNB-031","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"The rwy condition code was 3 with compacted snow. Braking action was poor and the A330-300 overran the end of Rwy 22 into the safety area. The crew had not recomputed the landing distance.","_truth":"B04"},{"report_key":"SYNB-009","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"A snow removal truck entered Runway 18R without a clearance at night. Departing traffic was held in position. The driver said the radio was on the wrong frequency.","_truth":"B01"},{"report_key":"SYNB-229","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["FUEL","RAMP"],"source_codes":"","narrative":"Fuel spilled from the left wing vent during refuelling at gate 5. The fire service covered the spill and the aircraft was refuelled again.","_truth":"background"},{"report_key":"SYNB-064","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["MAC"],"source_codes":"","narrative":"The flight crew climbed through the cleared altitude of FL180 by 500 feet. Traffic crossing triggered a TCAS resolution advisory to level off. The autopilot did not capture the altitude.","_truth":"B08"},{"report_key":"SYNB-123","source_id":"SYNTHETIC-B","phase":"Descent","l1_codes":["BIRD"],"source_codes":"","narrative":"On descent through 3,000 ft a large pelican struck the radome. The radome was dented and holed. The crew continued the approach with the FO flying.","_truth":"B16"},{"report_key":"SYNB-086","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["SCF-NP"],"source_codes":"","narrative":"On approach the nose gear showed unsafe with no green light. The alternate gear extension worked on the second attempt. The aircraft landed with emergency services standing by.","_truth":"B10"},{"report_key":"SYNB-182","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["WSTRW"],"source_codes":"","narrative":"On short final near a thunderstorm the airspeed dropped by 30 knots. The predictive windshear warning sounded and the captain and first officer flew the windshear escape manoeuvre. The aircraft lost 300 feet before climbing.","_truth":"B23"},{"report_key":"SYNB-214","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["BIRD"],"source_codes":"","narrative":"A bird struck the radome during the approach. No damage was found on inspection.","_truth":"background"},{"report_key":"SYNB-029","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"The runway condition code was 2 after freezing rain. Braking action was poor and the A330-300 overran the end of Runway 16 onto the grass. The crew had not recomputed the landing distance.","_truth":"B04"},{"report_key":"SYNB-221","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RE"],"source_codes":"","narrative":"A rejected takeoff at 80 knots was carried out for a master caution. The aircraft stopped on the rwy with hot brakes.","_truth":"background"},{"report_key":"SYNB-136","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","SCF-NP"],"source_codes":"","narrative":"During cruise at FL310 we noticed haze in the flight deck. The captain and first officer donned oxygen masks and ran the smoke checklist. The source was a failed display unit. The aircraft diverted.","_truth":"B18"},{"report_key":"SYNB-014","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["RI"],"source_codes":"","narrative":"The flight crew lined up on twy Bravo in darkness, mistaking its lights for Rwy 13. Tower called a go-around at 300 ft. The approach lighting for the assigned rwy was hidden by a NOTAM nobody had briefed.","_truth":"B02"},{"report_key":"SYNB-270","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["ICE"],"source_codes":"","narrative":"De-icing took 50 minutes because of a queue at the pad. The holdover time was checked again before departure.","_truth":"background"},{"report_key":"SYNB-271","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["CABIN"],"source_codes":"","narrative":"A passenger was found smoking in the aft lavatory. Cabin crew gave a formal warning.","_truth":"background"},{"report_key":"SYNB-125","source_id":"SYNTHETIC-B","phase":"Descent","l1_codes":["BIRD"],"source_codes":"","narrative":"On descent through 3,000 feet a large pelican struck the radome. Blood and feathers covered the windshield. The captain and first officer continued the approach with the FO flying.","_truth":"B16"},{"report_key":"SYNB-157","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the B777-300ER tail struck a light pole. The wing walker was not in position. The flight was cancelled.","_truth":"B20"},{"report_key":"SYNB-260","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["ARC"],"source_codes":"","narrative":"The A321neo touched down hard after a late flare. A hard landing inspection was carried out.","_truth":"background"},{"report_key":"SYNB-094","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["CFIT"],"source_codes":"","narrative":"Flying a VOR approach shortly after sunrise in clear conditions, the aircraft descended below the minimum altitude. The terrain awareness system called SINK RATE and the crew climbed away. The altimeter setting had been entered wrongly.","_truth":"B11"},{"report_key":"SYNB-102","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["NAV"],"source_codes":"","narrative":"On a route near a conflict area both GPS receivers reported a different time. ATC provided radar vectors. The crew reverted to conventional navigation.","_truth":"B12"},{"report_key":"SYNB-137","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","SCF-NP"],"source_codes":"","narrative":"During descent at FL330 the captain and first officer noticed an electrical burning smell in the flight deck. The captain and first officer donned oxygen masks and ran the smoke checklist. The source was an overheated window heat connector. The aircraft diverted.","_truth":"B18"},{"report_key":"SYNB-200","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"In cruise at FL350 the captain's and first officer's airspeeds disagreed by 40 knots. The autopilot disconnected and we flew pitch and power. A wasp nest was found in a pitot probe.","_truth":"B26"},{"report_key":"SYNB-128","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","CABIN"],"source_codes":"","narrative":"A passenger's power bank caught fire in a seat pocket. Cabin crew used a halon extinguisher and then water. The flight continued after the device cooled.","_truth":"B17"},{"report_key":"SYNB-263","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["TURB","CABIN"],"source_codes":"","narrative":"Moderate turbulence at FL180 spilled drinks in the cabin. There were no injuries.","_truth":"background"},{"report_key":"SYNB-252","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["WSTRW"],"source_codes":"","narrative":"A windshear alert was broadcast by the tower for Runway 09L. The approach was flown with extra speed but no windshear was met.","_truth":"background"},{"report_key":"SYNB-040","source_id":"SYNTHETIC-B","phase":"Go-around","l1_codes":["LOC-I"],"source_codes":"","narrative":"The crew initiated a go-around at 200 ft in clear conditions. With full thrust the pitch rose to 20 degrees and the speed decayed until the stick shaker activated. The aircraft rolled to 35 degrees of bank before recovery.","_truth":"B05"},{"report_key":"SYNB-099","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["OTHR"],"source_codes":"","narrative":"Near the Black Sea both GPS receivers reported a different time. ATC provided radar vectors. Several other e":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"The rwy condition code was 2 with compacted snow. Braking action was poor and the B787-9 overran the end of Rwy 18R by 40 metres. The touchdown was 1,500 ft long.","_truth":"B04"},{"report_key":"SYNB-043","source_id":"SYNTHETIC-B","phase":"Go-around","l1_codes":["LOC-I"],"source_codes":"","narrative":"The captain and first officer initiated a go-around at 1,000 feet in low visibility. With full thrust the pitch rose to 20 degrees and the speed decayed until the stick shaker activated. The autopilot had disconnected without the crew noticing.","_truth":"B05"},{"report_key":"SYNB-267","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["LOC-I"],"source_codes":"","narrative":"The autopilot disconnected briefly in light chop at FL180. We re-engaged it within a few seconds.","_truth":"background"},{"report_key":"SYNB-255","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RAMP"],"source_codes":"","narrative":"A belt loader struck the cargo door at the gate. The aircraft was taken out of service for inspection.","_truth":"background"},{"report_key":"SYNB-163","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A agitated passenger refused to follow crew instructions during the flight. Cabin crew moved the passenger to another seat. The aircraft diverted to offload the passenger.","_truth":"B21"},{"report_key":"SYNB-057","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the CRJ900 to turn left into conflicting traffic at FL280. The closest point was 1.2 miles and 400 feet. A similar call sign was on the frequency.","_truth":"B07"},{"report_key":"SYNB-135","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","SCF-NP"],"source_codes":"","narrative":"During climb at FL310 the crew noticed smoke in the flight deck. We donned oxygen masks and ran the smoke checklist. The source was a failed display unit. An emergency landing was made.","_truth":"B18"},{"report_key":"SYNB-154","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the B787-9 tail struck a light pole. The wing walker was not in position. The flight was cancelled.","_truth":"B20"},{"report_key":"SYNB-078","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL350 the green hydraulic system quantity dropped to zero. The crew ran the hydraulic loss checklist and diverted. The gear was extended by gravity.","_truth":"B09"},{"report_key":"SYNB-058","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the A320 to turn left into conflicting traffic at FL280. Both aircraft received TCAS resolution advisories. The sector was very busy.","_truth":"B07"},{"report_key":"SYNB-188","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["USOS"],"source_codes":"","narrative":"On a visual approach shortly after sunrise the A321neo touched down in the grass short of the threshold of Runway 16. The aircraft was below the glide path for the last mile. There were no injuries.","_truth":"B24"},{"report_key":"SYNB-068","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["MAC"],"source_codes":"","narrative":"The CAPT and FO climbed through the cleared altitude of FL330 by 300 ft. Traffic ahead triggered a TCAS resolution advisory to descend. The FO was busy with a checklist.","_truth":"B08"},{"report_key":"SYNB-091","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["CFIT"],"source_codes":"","narrative":"Flying a visual approach late in the evening with gusty winds, the aircraft descended below the minimum altitude. The terrain awareness system called SINK RATE and the crew climbed away. The final approach fix was misidentified.","_truth":"B11"},{"report_key":"SYNB-231","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["CABIN"],"source_codes":"","narrative":"A passenger was found smoking in the forward lavatory. Cabin crew checked the waste bin and found no fire.","_truth":"background"},{"report_key":"SYNB-212","source_id":"SYNTHETIC-B","phase":"Departure","l1_codes":["NAV"],"source_codes":"","narrative":"After departure the aircraft turned toward the wrong waypoint because an old route was loaded. ATC noticed the deviation and gave a heading.","_truth":"B28"},{"report_key":"SYNB-020","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"Landing on Rwy 04R with a 30-knot gusting crosswind, the B777-300ER drifted toward the edge. The aircraft veered off the right side of the rwy and struck an edge light. The nose gear was damaged.","_truth":"B03"},{"report_key":"SYNB-004","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"A snow removal truck entered Rwy 18R without a clearance shortly after sunrise. Landing traffic was sent around. The driver did not see the rwy guard lights.","_truth":"B01"},{"report_key":"SYNB-016","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["RI"],"source_codes":"","narrative":"The captain and first officer lined up on taxiway Alpha at night, mistaking its lights for Runway 04R. The aircraft landed on the taxiway, which was clear of traffic. The approach lighting for the assigned runway was hidden by a NOTAM nobody had briefed.","_truth":"B02"},{"report_key":"SYNB-209","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"Taxiing on taxiway Charlie late in the evening, the flight crew crossed the hold-short line for Runway 04R without a clearance. The airport diagram had not been briefed. No conflict occurred.","_truth":"B27"},{"report_key":"SYNB-098","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["NAV"],"source_codes":"","narrative":"Over the eastern Mediterranean both GPS receivers showed a position 40 miles in error. RNP approaches were no longer available. The position errors stopped after 20 minutes.","_truth":"B12"},{"report_key":"SYNB-071","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"At FL330 the left hydraulic system quantity dropped to zero. The flight crew ran the hydraulic loss checklist and continued to the destination. The gear was extended by gravity.","_truth":"B09"},{"report_key":"SYNB-186","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["USOS"],"source_codes":"","narrative":"On a non-precision approach late in the evening the B787-9 touched down 50 metres short of the threshold of Runway 34L. The crew misjudged the flare in a tailwind. Several approach lights were broken.","_truth":"B24"},{"report_key":"SYNB-015","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["RI"],"source_codes":"","narrative":"The flight crew lined up on taxiway Charlie at dusk, mistaking its lights for Runway 22. The crew went around at about 150 feet after seeing aircraft on the taxiway. The approach lighting for the assigned runway was set to a low intensity.","_truth":"B02"},{"report_key":"SYNB-092","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["CFIT"],"source_codes":"","narrative":"Flying a VOR approach late in the evening in light snow, the aircraft descended below the minimum altitude. The terrain awareness system called SINK RATE and the crew climbed away. The final approach fix was misidentified.","_truth":"B11"},{"report_key":"SYNB-158","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the B737-800 tail struck a light pole. The towbar shear pin failed. Both aircraft were taken out of service.","_truth":"B20"},{"report_key":"SYNB-220","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["ARC"],"source_codes":"","narrative":"The B787-9 touched down hard after a late flare. A hard landing inspection was carried out.","_truth":"background"},{"report_key":"SYNB-196","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["LOC-I"],"source_codes":"","narrative":"On climb-out the captain's and first officer's airspeeds disagreed by 60 knots. The stall warning sounded falsely and the crew flew pitch and power. A wasp nest was found in a pitot probe.","_truth":"B26"},{"report_key":"SYNB-269","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["FUEL","RAMP"],"source_codes":"","narrative":"Fuel spilled from the right wing vent during refuelling at gate 5. Passengers were kept on the bridge and the aircraft was refuelled again.","_truth":"background"},{"report_key":"SYNB-048","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["TURB"],"source_codes":"","narrative":"On final approach 3 miles behind a A380, the B737-800 encountered wake turbulence. The aircraft rolled 30 degrees to the left before the crew recovered. Winds were light and calm.","_truth":"B06"},{"report_key":"SYNB-054","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the A320 to descend into conflicting traffic at FL210. The closest point was 1.2 miles and 400 feet. There was a handover between controllers.","_truth":"B07"},{"report_key":"SYNB-177","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["TURB"],"source_codes":"","narrative":"On short final in gusty conditions the airspeed dropped by 25 knots. The reactive windshear warning sounded and the flight crew flew the windshear escape manoeuvre. A second approach was flown after the storm passed.","_truth":"B23"},{"report_key":"SYNB-265","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["SCF-PP"],"source_codes":"","narrative":"An engine vibration advisory appeared at FL210. The vibration stayed within limits and the flight continued.","_truth":"background"},{"report_key":"SYNB-088","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["CFIT"],"source_codes":"","narrative":"Flying a NDB approach at dusk in light rain, the aircraft descended below the minimum altitude. The terrain awareness system called SINK RATE and the crew climbed away. The final approach fix was misidentified.","_truth":"B11"},{"report_key":"SYNB-134","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","CABIN"],"source_codes":"","narrative":"A passenger's phone began smoking after being crushed in a seat mechanism. Cabin crew used a halon extinguisher and then water. The flight continued after the device cooled.","_truth":"B17"},{"report_key":"SYNB-095","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["NAV"],"source_codes":"","narrative":"Near the Black Sea both GPS receivers showed a position 40 miles in error. A false terrain warning followed. The crew reverted to conventional navigation.","_truth":"B12"},{"report_key":"SYNB-164","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A aggressive passenger shouted at cabin crew during the flight. Cabin crew moved the passenger to another seat. A report was filed with the authorities.","_truth":"B21"},{"report_key":"SYNB-005","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"A fuel truck entered Runway 36 without a clearance at night. Departing traffic was held in position. The driver did not see the runway guard lights.","_truth":"B01"},{"report_key":"SYNB-132","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","CABIN"],"source_codes":"","narrative":"A passenger's phone began smoking in the overhead bin. Cabin crew used a halon extinguisher and then water. The flight continued after the device cooled.","_truth":"B17"},{"report_key":"SYNB-122","source_id":"SYNTHETIC-B","phase":"Descent","l1_codes":["OTHR"],"source_codes":"","narrative":"On descent through 3,000 feet a large eagle struck the nose. The radome was dented and holed. The captain and first officer continued the approach with the FO flying.","_truth":"B16"},{"report_key":"SYNB-053","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the B767-300F to climb into conflicting traffic at FL210. The closest point was 1.2 miles and 400 ft. The sector was very busy.","_truth":"B07"},{"report_key":"SYNB-139","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","SCF-NP"],"source_codes":"","narrative":"During cruise at FL310 the flight crew noticed smoke in the flight deck. The captain and first officer donned oxygen masks and ran the smoke checklist. The source was chafed wiring behind a panel. The aircraft diverted.","_truth":"B18"},{"report_key":"SYNB-210","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"Taxiing on taxiway Charlie at night, the crew crossed the hold-short line for Runway 34L without a clearance. The FO was head-down programming the FMS. Tower told the crew to stop.","_truth":"B27"},{"report_key":"SYNB-148","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["FUEL"],"source_codes":"","narrative":"After two missed approaches with gusty winds, fuel dropped toward final reserve. The captain and first officer declared minimum fuel and received priority. The aircraft landed with 1,400 kg remaining, below final reserve.","_truth":"B19"},{"report_key":"SYNB-213","source_id":"SYNTHETIC-B","phase":"Departure","l1_codes":["OTHR"],"source_codes":"","narrative":"After departure the aircraft turned toward the wrong waypoint because the wrong departure procedure was entered. ATC noticed the deviation and gave a heading.","_truth":"B28"},{"report_key":"SYNB-090","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["CFIT"],"source_codes":"","narrative":"Flying a RNAV approach in daylight in light snow, the aircraft descended below the minimum altitude. The terrain awareness system called SINK RATE and the crew climbed away. The final approach fix was misidentified.","_truth":"B11"},{"report_key":"SYNB-197","
