y with no windshear encountered.","_truth":"background"},{"report_key":"SYNB-222","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RI","ATM"],"source_codes":"","narrative":"An aircraft taxied across Rwy 27R after being cleared to cross a different rwy. No other aircraft were nearby.","_truth":"background"},{"report_key":"SYNB-170","source_id":"SYNTHETIC-B","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"","narrative":"During rotation on Runway 16 the tail of the CRJ900 struck the runway. A gust raised the pitch rate. The flight crew continued after the tail strike light went out.","_truth":"B22"},{"report_key":"SYNB-173","source_id":"SYNTHETIC-B","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"","narrative":"During rotation on Runway 34L the tail of the B737-800 struck the runway. The pilot flying rotated early and fast. The captain and first officer continued after the tail strike light went out.","_truth":"B22"},{"report_key":"SYNB-133","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","CABIN"],"source_codes":"","narrative":"A passenger's laptop began smoking in the overhead bin. Cabin crew put the device in a containment bag. The flight continued after the device cooled.","_truth":"B17"},{"report_key":"SYNB-105","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-PP"],"source_codes":"","narrative":"At FL210 the number 2 engine oil pressure fell below the limit. We shut the engine down and declared an emergency. A loose oil line fitting was found.","_truth":"B13"},{"report_key":"SYNB-160","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A intoxicated passenger refused to follow crew instructions during the flight. Cabin crew moved the passenger to another seat. The aircraft diverted to offload the passenger.","_truth":"B21"},{"report_key":"SYNB-254","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["BIRD"],"source_codes":"","narrative":"A bird struck the windshield during the approach. No damage was found on inspection.","_truth":"background"},{"report_key":"SYNB-230","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["ICE"],"source_codes":"","narrative":"De-icing took 35 minutes because of a queue at the pad. The holdover time was checked again before departure.","_truth":"background"},{"report_key":"SYNB-124","source_id":"SYNTHETIC-B","phase":"Descent","l1_codes":["BIRD"],"source_codes":"","narrative":"On descent through 5,000 ft a large goose struck the nose. Blood and feathers covered the windshield. We continued the approach and landed without further problems.","_truth":"B16"},{"report_key":"SYNB-109","source_id":"SYNTHETIC-B","phase":"Ground","l1_codes":["ICE"],"source_codes":"","narrative":"After a long taxi in light snow, a passenger reported ice on the wing. The crew had already started the takeoff roll and rejected the takeoff.","_truth":"B14"},{"report_key":"SYNB-065","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["MAC"],"source_codes":"","narrative":"The captain and first officer climbed through the cleared altitude of FL330 by 700 feet. Traffic crossing triggered a TCAS resolution advisory to level off. The FO was busy with a checklist.","_truth":"B08"},{"report_key":"SYNB-041","source_id":"SYNTHETIC-B","phase":"Go-around","l1_codes":["LOC-I"],"source_codes":"","narrative":"The crew initiated a go-around at 500 ft in light snow. With full thrust the pitch rose to 25 degrees and the speed decayed until the stick shaker activated. The autopilot had disconnected without the crew noticing.","_truth":"B05"},{"report_key":"SYNB-162","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A agitated passenger tried to open a door during the flight. Cabin crew restrained the passenger with help from others. A report was filed with the authorities.","_truth":"B21"},{"report_key":"SYNB-208","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"Taxiing on taxiway Alpha shortly after sunrise, we crossed the hold-short line for Runway 16 without a clearance. The airport diagram had not been briefed. No conflict occurred.","_truth":"B27"},{"report_key":"SYNB-183","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["USOS"],"source_codes":"","narrative":"On a RNAV approach late in the evening the B787-9 touched down in the grass short of the threshold of Runway 22. A black-hole illusion made the approach look high. The main gear was damaged.","_truth":"B24"},{"report_key":"SYNB-103","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-PP"],"source_codes":"","narrative":"At FL180 the right engine oil pressure fell below the limit. The flight crew shut the engine down and returned. A loose oil line fitting was found.","_truth":"B13"},{"report_key":"SYNB-201","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"On climb-out the CAPT's and FO's airspeeds disagreed by 40 knots. The autopilot disconnected and the flight crew flew pitch and power. Ice crystals had blocked the probes.","_truth":"B26"},{"report_key":"SYNB-246","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["MAC"],"source_codes":"","narrative":"A TCAS traffic advisory was received for VFR traffic 500 ft below. No resolution advisory followed and the traffic passed clear.","_truth":"background"},{"report_key":"SYNB-237","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["F-NI"],"source_codes":"","narrative":"Smoke came from a galley oven during cruise. Cabin crew turned off the power and the smoke cleared.","_truth":"background"},{"report_key":"SYNB-026","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"Landing on Runway 36 in strong gusts from the left, the B737-800 drifted toward the edge. The aircraft veered off the right side of the runway before returning to the pavement. The runway was closed for two hours.","_truth":"B03"},{"report_key":"SYNB-227","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["LOC-I"],"source_codes":"","narrative":"The autopilot disconnected briefly in light chop at FL330. The captain and first officer re-engaged it after checking the flight controls.","_truth":"background"},{"report_key":"SYNB-161","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A aggressive passenger refused to follow crew instructions during the flight. Cabin crew restrained the passenger with help from others. Police met the aircraft on arrival.","_truth":"B21"},{"report_key":"SYNB-067","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["MAC"],"source_codes":"","narrative":"We climbed through the cleared altitude of FL310 by 300 feet. Traffic ahead triggered a TCAS resolution advisory to climb. The autopilot did not capture the altitude.","_truth":"B08"},{"report_key":"SYNB-081","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["SCF-NP"],"source_codes":"","narrative":"On approach the right main gear showed unsafe with no green light. The alternate gear extension did not lock the gear. A damaged downlock actuator was found.","_truth":"B10"},{"report_key":"SYNB-243","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["TURB","CABIN"],"source_codes":"","narrative":"Moderate turbulence at FL310 spilled drinks in the cabin. There were no injuries.","_truth":"background"},{"report_key":"SYNB-117","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["BIRD","SCF-PP"],"source_codes":"","narrative":"Passing 1,500 feet after takeoff from a regional airport, the B787-9 flew through a flock of gulls. The right engine showed high vibration after ingesting birds. The flight crew shut the engine down and returned. Bird remains were found in the engine core.","_truth":"B15"},{"report_key":"SYNB-032","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["RE"],"source_codes":"","narrative":"The rwy condition code was 3 with slush. Braking action was poor and the CRJ900 overran the end of Rwy 31L into the safety area. The crew had not recomputed the landing distance.","_truth":"B04"},{"report_key":"SYNB-228","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RAMP"],"source_codes":"","narrative":"Foreign object debris was found on the apron near gate 34. The area was swept before the next arrival.","_truth":"background"},{"report_key":"SYNB-047","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["TURB"],"source_codes":"","narrative":"On final approach 6 miles behind a B777, the B767-300F encountered wake turbulence. The aircraft rolled 40 degrees to the left before the crew recovered. Winds were light and calm.","_truth":"B06"},{"report_key":"SYNB-174","source_id":"SYNTHETIC-B","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"","narrative":"During rotation on Runway 36 the tail of the A320 struck the runway. The takeoff speeds had been computed with the wrong weight. We returned to land.","_truth":"B22"},{"report_key":"SYNB-235","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RAMP"],"source_codes":"","narrative":"A belt loader struck the fuselage at the gate. The aircraft was taken out of service for inspection.","_truth":"background"},{"report_key":"SYNB-244","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["SCF-NP"],"source_codes":"","narrative":"The cabin altitude rose to 10,000 ft when a pressurization controller failed. The crew descended and the cabin altitude returned to normal.","_truth":"background"},{"report_key":"SYNB-150","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["FUEL"],"source_codes":"","narrative":"After two missed approaches with a low overcast, fuel dropped toward final reserve. The crew declared MAYDAY FUEL and received priority. The aircraft landed with 900 kg remaining, just above final reserve.","_truth":"B19"},{"report_key":"SYNB-242","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["RI","ATM"],"source_codes":"","narrative":"An aircraft taxied across Rwy 09L after being cleared to cross a different rwy. No other aircraft were nearby.","_truth":"background"},{"report_key":"SYNB-165","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A aggressive passenger tried to open a door during the flight. Cabin crew restrained the passenger with help from others. The aircraft diverted to offload the passenger.","_truth":"B21"},{"report_key":"SYNB-264","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["SCF-NP"],"source_codes":"","narrative":"The cabin altitude rose to 9,000 feet when a pressurization controller failed. The crew descended and the cabin altitude returned to normal.","_truth":"background"},{"report_key":"SYNB-225","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["SCF-PP"],"source_codes":"","narrative":"An engine vibration advisory appeared at FL310. The vibration stayed within limits and the flight continued.","_truth":"background"},{"report_key":"SYNB-226","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["MAC"],"source_codes":"","narrative":"A TCAS traffic advisory was received for VFR traffic 500 feet below. No resolution advisory followed and the traffic passed clear.","_truth":"background"},{"report_key":"SYNB-168","source_id":"SYNTHETIC-B","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"","narrative":"During rotation on Rwy 34L the tail of the CRJ900 struck the rwy. The pilot flying rotated early and fast. The crew did not pressurize and returned.","_truth":"B22"},{"report_key":"SYNB-185","source_id":"SYNTHETIC-B","phase":"Landing","l1_codes":["USOS"],"source_codes":"","narrative":"On a visual approach shortly after sunrise the A321neo touched down in the grass short of the threshold of Rwy 36. The crew misjudged the flare in a tailwind. Several approach lights were broken.","_truth":"B24"},{"report_key":"SYNB-171","source_id":"SYNTHETIC-B","phase":"Takeoff","l1_codes":["ARC"],"source_codes":"","narrative":"During rotation on Rwy 27R the tail of the A330-300 struck the rwy. A gust raised the pitch rate. The flight crew returned to land.","_truth":"B22"},{"report_key":"SYNB-059","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the E175 to climb into conflicting traffic at FL330. Separation was lost. A similar call sign was on the frequency.","_truth":"B07"},{"report_key":"SYNB-217","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["F-NI"],"source_codes":"","narrative":"Smoke came from a lavatory light during cruise. Cabin crew turned off the power and the smoke cleared.","_truth":"background"},{"report_key":"SYNB-108","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-PP"],"source_codes":"","narrative":"At FL210 the left engine oil pressure fell below the limit. The flight crew shut the engine down and declared an emergency. A loose oil line fitting was found.","_truth":"B13"},{"report_key":"SYNB-166","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["CABIN"],"source_codes":"","narrative":"A aggressive passenger refused to follow crew instructions during the flight. Cabin crew informed the CAPT. A report was filed with the authorities.","_truth":"B21"},{"report_key":"SYNB-192","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["ICE"],"source_codes":"","narrative":"Holding at 10,000 feet in supercooled cloud, ice built up on the wings faster than expected. Airspeed decayed and more power was needed. The captain and first officer increased the approach speed.","_truth":"B25"},{"report_key":"SYNB-151","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the A320 wing tip struck a parked aircraft. The towbar shear pin failed. Both aircraft were taken out of service.","_truth":"B20"},{"report_key":"SYNB-147","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["FUEL"],"source_codes":"","narrative":"After a diversion to a busy alternate in clear conditions, fuel dropped toward final reserve. We declared MAYDAY FUEL and received priority. The aircraft landed with 1,400 kg remaining, just above final reserve.","_truth":"B19"},{"report_key":"SYNB-180","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["WSTRW"],"source_codes":"","narrative":"On short final near a thunderstorm the airspeed dropped by 25 knots. The predictive windshear warning sounded and the captain and first officer flew the windshear escape manoeuvre. The aircraft lost 300 feet before climbing.","_truth":"B23"},{"report_key":"SYNB-111","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["BIRD","SCF-PP"],"source_codes":"","narrative":"Passing 800 feet after takeoff from a high-elevation airport, the E175 flew through a flock of gulls. The number 1 engine surged with loud bangs after ingesting birds. The captain and first officer shut the engine down and returned. Bird remains were found in the engine core.","_truth":"B15"},{"report_key":"SYNB-219","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["FUEL"],"source_codes":"","narrative":"A fuel imbalance of 1,500 kg developed during cruise. The crew followed the fuel imbalance checklist and found no leak.","_truth":"background"},{"report_key":"SYNB-233","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["NAV"],"source_codes":"","narrative":"The FMS froze during preflight and had to be reloaded. The departure was delayed by 15 minutes.","_truth":"background"},{"report_key":"SYNB-063","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["MAC"],"source_codes":"","narrative":"The captain and first officer climbed through the cleared altitude of FL350 by 500 feet. Traffic ahead triggered a TCAS resolution advisory to descend. The autopilot did not capture the altitude.","_truth":"B08"},{"report_key":"SYNB-190","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["ICE"],"source_codes":"","narrative":"Holding at 8,000 feet in icing conditions, ice built up on the wings faster than expected. The windshield iced over. The captain and first officer increased the approach speed.","_truth":"B25"},{"report_key":"SYNB-002","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"A maintenance worker on foot entered Runway 27R without a clearance in daylight. Departing traffic was held in position. The driver said the radio was on the wrong frequency.","_truth":"B01"},{"report_key":"SYNB-104","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-PP"],"source_codes":"","narrative":"At FL370 the right engine oil pressure fell below the limit. The flight crew shut the engine down and declared an emergency. The oil filter was found clogged.","_truth":"B13"},{"report_key":"SYNB-189","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["ICE"],"source_codes":"","narrative":"Holding at 8,000 feet in freezing drizzle, ice built up on the wings faster than expected. The windshield iced over. The crew increased the approach speed.","_truth":"B25"},{"report_key":"SYNB-273","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["NAV"],"source_codes":"","narrative":"The FMS showed an expired database during preflight and had to be reloaded. The departure was delayed by 15 minutes.","_truth":"background"},{"report_key":"SYNB-066","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["MAC"],"source_codes":"","narrative":"The crew climbed through the cleared altitude of FL280 by 300 ft. Traffic above triggered a TCAS resolution advisory to level off. The autopilot did not capture the altitude.","_truth":"B08"},{"report_key":"SYNB-037","source_id":"SYNTHETIC-B","phase":"Go-around","l1_codes":["LOC-I"],"source_codes":"","narrative":"We initiated a go-around at 200 feet with a low overcast. With full thrust the pitch rose to 25 degrees and the speed decayed until the stick shaker activated. The aircraft rolled to 35 degrees of bank before recovery.","_truth":"B05"},{"report_key":"SYNB-006","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"A fuel truck entered Runway 09L without a clearance late in the evening. Landing traffic was sent around. The driver misunderstood a hold-short instruction.","_truth":"B01"},{"report_key":"SYNB-119","source_id":"SYNTHETIC-B","phase":"Descent","l1_codes":["BIRD"],"source_codes":"","narrative":"On descent through 3,000 ft a large goose struck the windshield. The outer windshield pane cracked. The CAPT and FO continued the approach after declaring an emergency.","_truth":"B16"},{"report_key":"SYNB-152","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the B737 MAX 8 wing tip struck a parked aircraft. The wing walker was not in position. The flight was cancelled.","_truth":"B20"},{"report_key":"SYNB-257","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["F-NI"],"source_codes":"","narrative":"Smoke came from a coffee maker during cruise. Cabin crew turned off the power and the smoke cleared.","_truth":"background"},{"report_key":"SYNB-114","source_id":"SYNTHETIC-B","phase":"Climb","l1_codes":["BIRD","SCF-PP"],"source_codes":"","narrative":"Passing 400 feet after takeoff from a coastal airport, the B737 MAX 8 flew through a flock of geese. The number 1 engine showed high vibration after ingesting birds. We returned to land. Bird remains were found in the engine core.","_truth":"B15"},{"report_key":"SYNB-224","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["SCF-NP"],"source_codes":"","narrative":"The cabin altitude rose to 10,000 feet when a pressurization controller failed. The crew descended and the cabin altitude returned to normal.","_truth":"background"},{"report_key":"SYNB-205","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"Taxiing on taxiway Charlie at night, the crew crossed the hold-short line for Runway 22 without a clearance. The crew read back hold short but did not stop. No conflict occurred.","_truth":"B27"},{"report_key":"SYNB-007","source_id":"SYNTHETIC-B","phase":"Taxi","l1_codes":["RI"],"source_codes":"","narrative":"A maintenance worker on foot entered Runway 27R without a clearance late in the evening. An aircraft on its takeoff roll was told to stop. The driver did not see the runway guard lights.","_truth":"B01"},{"report_key":"SYNB-018","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["RI"],"source_codes":"","narrative":"The CAPT and FO lined up on twy Charlie at dusk, mistaking its lights for Rwy 13. The crew went around at about 150 ft after seeing aircraft on the twy. The approach lighting for the assigned rwy was set to a low intensity.","_truth":"B02"},{"report_key":"SYNB-238","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["ATM"],"source_codes":"","narrative":"Frequency congestion delayed the approach clearance. The crew had to request the clearance several times.","_truth":"background"},{"report_key":"SYNB-199","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-NP"],"source_codes":"","narrative":"On climb-out the captain's and first officer's airspeeds disagreed by 60 knots. The autopilot disconnected and we flew pitch and power. A wasp nest was found in a pitot probe.","_truth":"B26"},{"report_key":"SYNB-106","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["SCF-PP"],"source_codes":"","narrative":"At FL180 the right engine oil pressure fell below the limit. The captain and first officer shut the engine down and diverted. Oil had leaked from a cracked seal.","_truth":"B13"},{"report_key":"SYNB-144","source_id":"SYNTHETIC-B","phase":"Approach","l1_codes":["FUEL"],"source_codes":"","narrative":"After two missed approaches in clear conditions, fuel dropped toward final reserve. We declared minimum fuel and received priority. The aircraft landed with 1,100 kg remaining, below final reserve.","_truth":"B19"},{"report_key":"SYNB-055","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the B737 MAX 8 to climb into conflicting traffic at FL330. The closest point was 1.2 miles and 400 feet. A similar call sign was on the frequency.","_truth":"B07"},{"report_key":"SYNB-056","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["MAC","ATM"],"source_codes":"","narrative":"The controller cleared the B777-300ER to turn left into conflicting traffic at FL310. Both aircraft received TCAS resolution advisories. A similar call sign was on the frequency.","_truth":"B07"},{"report_key":"SYNB-101","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["NAV"],"source_codes":"","narrative":"Near the Black Sea both GPS receivers showed a position 40 miles in error. A false terrain warning followed. The position errors stopped after 20 minutes.","_truth":"B12"},{"report_key":"SYNB-141","source_id":"SYNTHETIC-B","phase":"Cruise","l1_codes":["F-NI","SCF-NP"],"source_codes":"","narrative":"During descent at FL240 the captain and first officer noticed smoke in the flight deck. The crew donned oxygen masks and ran the smoke checklist. The source was an overheated window heat connector. The smoke cleared after the bus was isolated.","_truth":"B18"},{"report_key":"SYNB-223","source_id":"SYNTHETIC-B","phase":"Various","l1_codes":["TURB","CABIN"],"source_codes":"","narrative":"Moderate turbulence at FL240 spilled drinks in the cabin. There were no injuries.","_truth":"background"},{"report_key":"SYNB-153","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the CRJ900 tail struck a light pole. The tug driver could not see the wing tip. The aircraft was inspected and found damaged.","_truth":"B20"},{"report_key":"SYNB-155","source_id":"SYNTHETIC-B","phase":"Pushback","l1_codes":["RAMP"],"source_codes":"","narrative":"During pushback from the gate the A320 struck a baggage cart. The wing walker was not in position. Both aircraft were taken out of service.","_truth":"B20"}],"definitions":[{"id":"IND-01","source":"ICAO Doc 9870, Manual on the Prevention of Runway Incursions","term":"Runway incursion","parents":["RI"],"text":"Any occurrence at an aerodrome involving the incorrect presence of an aircraft, vehicle or person on the protected area of a surface designated for the landing and takeoff of aircraft."},{"id":"IND-02","source":"FAA Runway Safety programme","term":"Runway incursion types","parents":["RI"],"text":"Runway incursions are classified by cause as pilot deviations, operational incidents (controller actions) or vehicle and pedestrian deviations, and by severity from A to D."},{"id":"IND-03","source":"FAA Runway Safety programme","term":"Wrong-surface event","parents":["RI"],"text":"A landing, attempted landing, line-up or takeoff on a surface other than the one assigned: a wrong runway, a taxiway, a closed runway or the wrong airport."},{"id":"IND-04","source":"NASA ASRS coding taxonomy","term":"Anomaly: Ground Incursion - Runway or Taxiway","parents":["RI"],"text":"An aircraft, vehicle or person entering a runway or taxiway without authorization, or an aircraft using a taxiway or the wrong runway for landing or takeoff."},{"id":"IND-05","source":"SKYbrary - Runway Excursion","term":"Runway excursion (veer-off and overrun)","parents":["RE"],"text":"An aircraft leaves the runway surface during takeoff or landing, either by veering off the side or by overrunning the end."},{"id":"IND-06","source":"ICAO Global Reporting Format (GRF) for runway surface conditions","term":"Runway condition code (RWYCC)","parents":["RE"],"text":"A runway condition code from 6 (dry) down to 0 reports braking performance on wet or contaminated runways (water, slush, snow, ice), so crews can recompute landing distance."},{"id":"IND-07","source":"NASA ASRS coding taxonomy","term":"Anomaly: Ground Excursion - Runway","parents":["RE"],"text":"An aircraft departs the runway surface during the takeoff or landing roll, including overruns after a long or fast landing."},{"id":"IND-08","source":"IATA - Loss of Control In-flight (LOC-I)","term":"Loss of control in-flight","parents":["LOC-I"],"text":"A significant, unintended departure of the aircraft from controlled flight, such as a stall, spin or upset, often following a system malfunction or crew response to erroneous indications."},{"id":"IND-09","source":"SKYbrary - Unreliable Airspeed","term":"Unreliable airspeed","parents":["LOC-I","SCF-NP"],"text":"Erroneous or disagreeing airspeed indications, for example from pitot icing, ice crystals or a blocked pitot tube, which can lead to an upset if the crew follows the wrong indication."},{"id":"IND-10","source":"ICAO Annex 10 - Airborne Collision Avoidance System (ACAS)","term":"Resolution advisory (RA)","parents":["MAC"],"text":"An ACAS or TCAS indication to the flight crew recommending a vertical manoeuvre to increase separation from conflicting traffic."},{"id":"IND-11","source":"EUROCONTROL - Level bust","term":"Level bust (altitude deviation)","parents":["MAC","NAV"],"text":"An unauthorised vertical deviation of more than 300 feet from the cleared flight level or altitude, a common cause of loss of separation and TCAS resolution advisories."},{"id":"IND-12","source":"NASA ASRS coding taxonomy","term":"Conflict: Airborne Conflict / NMAC","parents":["MAC"],"text":"Two aircraft in flight come into conflict or lose separation, including near midair collisions and TCAS events."},{"id":"IND-13","source":"SKYbrary - Clear Air Turbulence","term":"Clear-air turbulence (CAT)","parents":["TURB"],"text":"Turbulence in cloud-free air, often near jet streams or over mountains, with no visual cue and often not shown on weather radar."},{"id":"IND-14","source":"FAA Advisory Circular 120-88A - Preventing Injuries Caused by Turbulence","term":"Turbulence-related injuries","parents":["TURB","CABIN"],"text":"Passengers and flight attendants are injured in turbulence mainly when standing or not wearing seat belts, and by unsecured carts and galley equipment."},{"id":"IND-15","source":"FAA National Wildlife Strike Database","term":"Wildlife strike","parents":["BIRD"],"text":"A collision between an aircraft and a bird or other wildlife, including ingestion into an engine, reported with damage and phase of flight."},{"id":"IND-16","source":"14 CFR 33.76 - Bird ingestion (engine certification)","term":"Engine bird ingestion","parents":["SCF-PP","BIRD"],"text":"Engines must be shown to withstand the ingestion of birds of defined sizes; large or multiple bird ingestion can damage fan blades and cause surge, loss of thrust, shutdown or fire."},{"id":"IND-17","source":"FAA holdover time guidelines (ground de-icing and anti-icing)","term":"Holdover time","parents":["ICE"],"text":"The estimated time a de-icing or anti-icing fluid protects aircraft surfaces from frost or ice; if it is exceeded before takeoff, the aircraft must be checked or de-iced again."},{"id":"IND-18","source":"SKYbrary - Hard Landing and Tail Strike","term":"Hard landing, tail strike","parents":["ARC"],"text":"A touchdown with a vertical load above limits, a bounced landing, or contact of the tail with the runway during takeoff rotation or landing flare."},{"id":"IND-19","source":"FAA Runway Safety programme","term":"Vehicle or pedestrian deviation","parents":["RI"],"text":"A runway incursion caused by a ground vehicle or a person, such as a driver or pedestrian entering a runway without ATC authorization."},{"id":"IND-20","source":"SKYbrary - Crosswind Landings","term":"Crosswind landing","parents":["RE"],"text":"Landing with a wind component across the runway; strong or gusty crosswinds near the aircraft limit increase the risk of lateral runway excursion (veer-off)."},{"id":"IND-21","source":"FAA Advisory Circular 120-109A - Stall Prevention and Recovery Training","term":"Stall prevention and recovery","parents":["LOC-I"],"text":"Training to recognise and recover from approaches to stall and full stalls, including during go-arounds with high thrust and pitch."},{"id":"IND-22","source":"FAA Advisory Circular 90-23G - Aircraft Wake Turbulence","term":"Wake turbulence","parents":["TURB"],"text":"Vortices from a preceding aircraft, strongest behind heavy aircraft at slow speed, can cause sudden rolls on approach or departure; spacing reduces the risk."},{"id":"IND-23","source":"ICAO Doc 4444 - PANS-ATM (separation minima)","term":"Loss of separation","parents":["MAC","ATM"],"text":"Two aircraft come closer than the prescribed separation minima, often after an ATC clearance or instruction puts them in conflict."},{"id":"IND-24","source":"SKYbrary - Hydraulic System Failure","term":"Hydraulic system failure","parents":["SCF-NP"],"text":"Loss of hydraulic fluid or pressure that degrades flight controls, brakes, steering or landing gear, handled with non-normal checklists."},{"id":"IND-25","source":"SKYbrary - Landing Gear Malfunction","term":"Landing gear malfunction","parents":["SCF-NP"],"text":"Failure of a landing gear leg to extend, retract or lock, requiring alternate extension or a landing with gear not fully down."},{"id":"IND-26","source":"14 CFR 121.354 - Terrain awareness and warning system","term":"Terrain awareness and warning system (TAWS)","parents":["CFIT"],"text":"Airliners must carry a system that warns the crew of terrain, obstacles and excessive descent so they can climb away before impact."},{"id":"IND-27","source":"EASA Safety Information Bulletin 2022-02 - GNSS outages and alterations","term":"GNSS jamming and spoofing","parents":["NAV"],"text":"Interference with satellite navigation signals, by jamming or spoofing, causes loss of GPS position, false positions or false terrain warnings, especially near conflict zones."},{"id":"IND-28","source":"SKYbrary - In-Flight Shutdown","term":"In-flight engine shutdown (IFSD)","parents":["SCF-PP"],"text":"An engine is shut down in flight because of a failure or a precautionary indication such as low oil pressure, high vibration or fire."},{"id":"IND-29","source":"FAA Advisory Circular 120-60B - Ground Deicing and Anti-icing Program","term":"Clean aircraft concept","parents":["ICE"],"text":"No takeoff may be made with frost, ice or snow adhering to wings or control surfaces; contamination must be removed before departure."},{"id":"IND-30","source":"ICAO Doc 10117 - Manual on the Legal Aspects of Unruly and Disruptive Passengers","term":"Unruly or disruptive passenger","parents":["CABIN"],"text":"A passenger who fails to respect rules of conduct or to follow crew instructions, disturbing good order and discipline on board."},{"id":"IND-31","source":"FAA SAFO - Fire risks from lithium batteries in the cabin","term":"Lithium battery fire","parents":["F-NI","CABIN"],"text":"Portable electronic devices and power banks can overheat in thermal runaway, producing smoke and fire in the cabin; crew cool the device with water or non-alcoholic liquid."},{"id":"IND-32","source":"SKYbrary - Smoke and Fumes","term":"Smoke or fumes in flight","parents":["F-NI"],"text":"Smoke, fumes or burning smells in the flight deck or cabin, often electrical in origin, handled with oxygen masks and the smoke checklist."},{"id":"IND-33","source":"ICAO Annex 6 - Fuel planning and in-flight fuel management","term":"Minimum fuel and fuel emergency","parents":["FUEL"],"text":"The crew declares MINIMUM FUEL when any change may land them below final reserve, and MAYDAY FUEL when the landing fuel is expected to be below final reserve."},{"id":"IND-34","source":"IATA Ground Operations Manual - Pushback and towing","term":"Pushback and towing","parents":["RAMP"],"text":"Moving an aircraft with a tug or towbar, with wing walkers and headset communication, to prevent collisions with aircraft, vehicles and objects."},{"id":"IND-35","source":"SKYbrary - Tailstrike","term":"Tail strike","parents":["ARC"],"text":"The aft fuselage contacts the runway during takeoff rotation or landing, often after early rotation, wrong takeoff speeds or excessive pitch."},{"id":"IND-36","source":"FAA Advisory Circular 00-54 - Pilot Windshear Guide","term":"Low-level windshear","parents":["WSTRW"],"text":"Sudden changes in wind speed or direction near the ground, such as microbursts from thunderstorms, causing airspeed loss; crews fly the windshear escape manoeuvre."},{"id":"IND-37","source":"SKYbrary - Landing Short (Undershoot)","term":"Undershoot","parents":["USOS"],"text":"The aircraft touches down before the runway threshold, often after an unstable or low approach or a visual illusion."},{"id":"IND-38","source":"FAA Advisory Circular 91-74B - Pilot Guide: Flight in Icing Conditions","term":"In-flight airframe icing","parents":["ICE"],"text":"Ice accumulates on wings, tail and windshield in supercooled cloud or freezing drizzle, increasing drag and stall speed."},{"id":"IND-39","source":"FAA National Wildlife Strike Database - strike reporting","term":"Damaging bird strike","parents":["BIRD"],"text":"A collision with birds that damages the aircraft, such as a cracked windshield, dented radome or ingested engine, reported to the wildlife strike database."},{"id":"IND-40","source":"FAA Runway Safety programme - Pilot deviation","term":"Pilot deviation (runway incursion)","parents":["RI"],"text":"A runway incursion caused by a pilot, such as crossing a hold-short line or entering a runway without an ATC clearance."},{"id":"IND-41","source":"SKYbrary - Lateral Navigation Error","term":"Lateral navigation error","parents":["NAV"],"text":"The aircraft leaves its cleared route because of a wrong route, waypoint or procedure loaded in the flight management system."}],"parents":[{"code":"RI","name":"Runway Incursion","in_scope":true,"definition":"Incorrect presence of an aircraft, vehicle or person on the protected area of a surface designated for the landing and takeoff of aircraft. Includes entering or crossing a runway without clearance.","team_note":"In the SEWG pilot, landing or takeoff on an unintended surface (taxiway, closed or wrong runway, wrong airport) is decomposed under RI (US 311617)."},{"code":"RE","name":"Runway Excursion","in_scope":true,"definition":"An aircraft veers off the side of the runway or overruns the end of the runway during takeoff or landing."},{"code":"ARC","name":"Abnormal Runway Contact","in_scope":true,"definition":"Any landing or takeoff involving abnormal contact with the runway or landing surface, such as hard landings, bounced landings, tail strikes and wing or nacelle strikes."},{"code":"LOC-I","name":"Loss of Control - Inflight","in_scope":true,"definition":"Loss of aircraft control or an extreme deviation from the intended flight path while in flight, including stalls and upsets."},{"code":"MAC","name":"Airprox / ACAS alert / loss of separation / near midair / midair collision","in_scope":true,"definition":"Airprox, ACAS or TCAS alerts, loss of separation, and near or actual midair collisions between aircraft in flight."},{"code":"TURB","name":"Turbulence Encounter","in_scope":true,"definition":"In-flight encounter with turbulence, including clear-air, mountain wave, convective and wake turbulence."},{"code":"SCF-PP","name":"System/Component Failure - Powerplant","in_scope":true,"definition":"Failure or malfunction of an aircraft system or component related to the powerplant, including engine shutdown, surge, loss of thrust and engine fire."},{"code":"SCF-NP","name":"System/Component Failure - Non-Powerplant","in_scope":true,"definition":"Failure or malfunction of an aircraft system or component other than the powerplant, such as flight instruments, pitot-static and air data systems."},{"code":"BIRD","name":"Bird","in_scope":true,"definition":"Occurrence involving a collision or near collision with birds, including bird ingestion into engines."},{"code":"ICE","name":"Icing","in_scope":true,"definition":"Accumulation of snow, ice, freezing rain or frost on aircraft surfaces or sensors that adversely affects control, performance or instrument indications, including ground de-icing issues."},{"code":"CFIT","name":"Controlled Flight Into or Toward Terrain","in_scope":true,"definition":"In-flight collision or near collision with terrain, water or an obstacle without indication of loss of control, including terrain warnings."},{"code":"CABIN","name":"Cabin Safety Events","in_scope":true,"definition":"Occurrences in the passenger cabin of transport aircraft, including injuries to passengers or cabin crew and unsecured carts or galley equipment."},{"code":"NAV","name":"Navigation Error","in_scope":true,"definition":"Navigating the aircraft incorrectly, including deviations from the cleared route or altitude and landing at the wrong airport."},{"code":"ATM","name":"ATM/CNS","in_scope":true,"co_code_only":true,"definition":"Occurrences involving air traffic management or communication, navigation and surveillance services, such as controller errors or clearance misunderstandings."},{"code":"RAMP","name":"Ground Handling","in_scope":true,"definition":"Occurrences during ground handling operations, such as servicing, loading and towing, including damage from ground equipment."},{"code":"F-NI","name":"Fire/Smoke (Non-Impact)","in_scope":true,"definition":"Fire or smoke in or on the aircraft, in flight or on the ground, not resulting from an impact."},{"code":"FUEL","name":"Fuel Related","in_scope":true,"definition":"Occurrences related to fuel quantity, imbalance, contamination or fuel system management."},{"code":"WSTRW","name":"Windshear or Thunderstorm","in_scope":true,"definition":"Flight into windshear or thunderstorm, including microbursts, sudden wind changes and associated loss of airspeed or altitude."},{"code":"USOS","name":"Undershoot/Overshoot","in_scope":true,"definition":"A touchdown off the runway surface before the threshold (undershoot) or a landing beyond the runway end that is not an excursion during the roll."},{"code":"OTHR","name":"Other","in_scope":false,"definition":"Occurrences that do not fit any other category; a holding pool for emerging issues."}],"guardrails":[{"test":"Parent not in the allowed list","status":"not_grounded","failed_checks":"G1 G2 G3 G5","base_candidate":"C2"},{"test":"Invented definition id","status":"not_grounded","failed_checks":"G2","base_candidate":"C2"},{"test":"Definition from another parent","status":"not_grounded","failed_checks":"G2","base_candidate":"C2"},{"test":"Paraphrased evidence","status":"not_grounded","failed_checks":"G4 G5","base_candidate":"C2"},{"test":"Report from another parent","status":"not_grounded","failed_checks":"G3","base_candidate":"C2"},{"test":"Invented report key","status":"not_grounded","failed_checks":"G3","base_candidate":"C2"}],"parent_selection":[{"mode":"definition_only","candidate_id":"C1","chosen":"NAV","expected":"RI","correct":"False"},{"mode":"definition_only","candidate_id":"C2","chosen":"RI","expected":"RI","correct":"True"},{"mode":"definition_only","candidate_id":"C3","chosen":"USOS","expected":"RE","correct":"False"},{"mode":"definition_only","candidate_id":"C4","chosen":"CFIT","expected":"LOC-I","correct":"False"},{"mode":"definition_only","candidate_id":"C5","chosen":"MAC","expected":"MAC","correct":"True"},{"mode":"definition_only","candidate_id":"C6","chosen":"TURB","expected":"TURB","correct":"True"},{"mode":"definition_only","candidate_id":"C7","chosen":"BIRD","expected":"SCF-PP","correct":"False"},{"mode":"definition_only","candidate_id":"C8","chosen":"ICE","expected":"ICE","correct":"True"},{"mode":"definition_only","candidate_id":"C9","chosen":"ARC","expected":"ARC","correct":"True"},{"mode":"definition_only","candidate_id":"B01","chosen":"RI","expected":"RI","correct":"True"},{"mode":"definition_only","candidate_id":"B02","chosen":"ARC","expected":"RI","correct":"False"},{"mode":"definition_only","candidate_id":"B03","chosen":"RE","expected":"RE","correct":"True"},{"mode":"definition_only","candidate_id":"B04","chosen":"RE","expected": <script>
"use strict";
const SEED = JSON.parse(document.getElementById("seed").textContent);
const S = {
  runs: { rules: SEED.rules, llm: SEED.llm },
  reports: Object.fromEntries(SEED.reports.map(r => [r.report_key, r])),
  defs: Object.fromEntries(SEED.definitions.map(d => [d.id, d])),
  parents: Object.fromEntries(SEED.parents.map(p => [p.code, p])),
  guardrails: SEED.guardrails, parentSel: SEED.parent_selection,
  mode: "rules", cand: null, filter: "all", q: "", dataTab: "reports", dataQ: "", dataCode: "", synthetic: true, loadedNote: ""
};
const CHECK_NAMES = {
  G1: "Parent is an allowed CICTT category", G2: "Definitions exist and are crosswalked to the parent",
  G3: "Every report exists and is coded to the parent", G4: "Evidence is quoted word for word",
  G5: "Enough supporting reports", G6: "Evidence sits under the parent", G7: "Clear winner among parents",
  G8: "Matches the parent proposed by discovery" };
const STATUS_LABEL = { grounded: "Grounded", needs_review: "Needs review", not_grounded: "Not grounded" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const run = () => S.runs[S.mode] || S.runs.rules || S.runs.llm;
const results = () => (run() ? run().results : []);
const byCand = (id, r = run()) => r && r.results.find(x => x.candidate.candidate_id === id);
const pct = x => (x == null ? "-" : Math.round(x * 100) + "%");
const pill = st => `<span class="pill ${esc(st)}">${esc(STATUS_LABEL[st] || st)}</span>`;
const stColor = st => ({ grounded: "var(--ok)", needs_review: "var(--warn)", not_grounded: "var(--bad)" }[st] || "var(--faint)");

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 4200); }
function store(k, v) { try { localStorage.setItem("gtv-" + k, v); } catch (e) {} }
function recall(k) { try { return localStorage.getItem("gtv-" + k); } catch (e) { return null; } }

/* ---------------- summary ---------------- */
function renderSummary() {
  const r = run(); const el = document.getElementById("summary");
  if (!r) { el.innerHTML = `<div class="drop">No results loaded.</div>`; return; }
  const sm = r.summary || {}; const st = sm.status || {}; const n = r.results.length;
  const seg = k => `<i style="width:${(100 * (st[k] || 0) / n).toFixed(1)}%;background:${stColor(k)}"></i>`;
  const modeLabel = { manual: "Typed candidates (browser engine or interactive.py)", deterministic: "Rules selector", "llm-file": "Constrained prompt (answers from file)", "llm-codex": "Constrained prompt (Codex)" }[r.mode] || r.mode;
  el.innerHTML = `<div class="tiles">
    <div class="tile"><div class="k">Outcome of ${n} candidates</div>
      <div class="stack" role="img" aria-label="${st.grounded || 0} grounded, ${st.needs_review || 0} need review, ${st.not_grounded || 0} not grounded">${seg("grounded")}${seg("needs_review")}${seg("not_grounded")}</div>
      <div class="legend"><span><i class="dot" style="background:var(--ok)"></i><b>${st.grounded || 0}</b> grounded</span>
      <span><i class="dot" style="background:var(--warn)"></i><b>${st.needs_review || 0}</b> need review</span>
      <span><i class="dot" style="background:var(--bad)"></i><b>${st.not_grounded || 0}</b> not grounded</span></div></div>
    <div class="tile"><div class="k">Parents correct</div><div class="v">${sm.parent_correct ?? "-"}<span style="font-size:18px;color:var(--muted)"> / ${n}</span></div><div class="s">against the answer key</div></div>
    <div class="tile"><div class="k">Report links - precision</div><div class="v">${pct(sm.report_precision)}</div><div class="s">${sm.tp ?? "-"} correct, ${sm.fp ?? "-"} wrong${sm.overlap_precision != null ? ` - <b>${pct(sm.overlap_precision)}</b> counting overlaps` : ""}</div></div>
    <div class="tile"><div class="k">Report links - recall</div><div class="v">${pct(sm.report_recall)}</div><div class="s">${sm.fn ?? "-"} expected report${sm.fn === 1 ? "" : "s"} missed${sm.overlap_recall != null ? ` - <b>${pct(sm.overlap_recall)}</b> counting overlaps` : ""}</div></div>
  </div>
  <div class="runline"><span>Run <code>${esc(r.run_id)}</code></span><span>${esc(modeLabel)}</span><span>Embedder <code>${esc(r.embedder)}</code> (${esc(r.dims)} dims)</span>
  ${S.loadedNote ? `<span>${esc(S.loadedNote)}</span>` : ""}</div>`;
  document.getElementById("m-rules").disabled = !S.runs.rules;
  document.getElementById("m-llm").disabled = !S.runs.llm;
  document.getElementById("m-rules").setAttribute("aria-pressed", String(S.mode === "rules"));
  document.getElementById("m-llm").setAttribute("aria-pressed", String(S.mode === "llm"));
  const mm = document.getElementById("m-man"); mm.hidden = !S.runs.manual; mm.setAttribute("aria-pressed", String(S.mode === "manual"));
  if (S.runs.manual) mm.textContent = `Typed (${S.runs.manual.results.length})`;
  document.getElementById("sampletag").hidden = !S.synthetic;
}

/* ---------------- chain diagram (SVG) ---------------- */
function wrapText(t, n) { const w = String(t).split(/\s+/); const out = []; let cur = ""; for (const x of w) { if ((cur + " " + x).trim().length > n) { if (cur) out.push(cur); cur = x; } else cur = (cur + " " + x).trim(); } if (cur) out.push(cur); return out; }
function svgText(x, y, lines, cls, size, weight, fill, lh = 1.3) {
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight || 400}" fill="${fill}">${lines.map((l, i) => `<tspan x="${x}" dy="${i ? size * lh : 0}">${esc(l)}</tspan>`).join("")}</text>`;
}
function chainSVG(res) {
  const c = res.candidate, o = res.output, m = res.metrics || {};
  const reps = o.supporting_reports.map(s => ({ ...s, kind: (m.fp || []).includes(s.report_key) ? "fp" : "tp" }));
  (m.fn || []).forEach(k => reps.push({ report_key: k, evidence: null, kind: "fn" }));
  const defs = o.definition_ids;
  const RH = 62, RG = 10, W = 1000;
  const H = Math.max(260, reps.length * (RH + RG) + 60, defs.length * 96 + 60);
  const mid = H / 2;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { ink: css("--ink"), muted: css("--muted"), navy: css("--navy"), navyS: css("--navy-soft"), teal: css("--teal"), tealS: css("--teal-soft"),
    ok: css("--ok"), okS: css("--ok-soft"), warn: css("--warn"), warnS: css("--warn-soft"), bad: css("--bad"), badS: css("--bad-soft"), surf: css("--surface"), on: css("--on-navy") };
  let g = "";
  const line = (x1, y1, x2, y2, col, dash) => `<path d="M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="1.6" ${dash ? 'stroke-dasharray="5 4"' : ""}/>`;
  // candidate
  const cl = wrapText(c.name, 26), dl = wrapText(c.definition, 38).slice(0, 5);
  const ch = 40 + cl.length * 19 + dl.length * 15;
  g += `<rect x="6" y="${mid - ch / 2}" width="230" height="${ch}" rx="10" fill="${C.navyS}" stroke="${C.navy}" stroke-width="1.6"/>`;
  g += svgText(20, mid - ch / 2 + 22, [`CANDIDATE ${c.candidate_id}`], "", 11, 700, C.navy);
  g += svgText(20, mid - ch / 2 + 44, cl, "", 15, 700, C.ink);
  g += svgText(20, mid - ch / 2 + 50 + cl.length * 19, dl, "", 11.5, 400, C.muted);
  // parent
  const p = S.parents[o.parent_code] || { code: o.parent_code, name: "Not an allowed parent" };
  const pOk = !!S.parents[o.parent_code];
  const changed = o.parent_code !== c.proposed_parent;
  g += line(236, mid, 280, mid, C.navy);
  g += `<g class="nodehit" data-jump="parent"><rect x="280" y="${mid - 48}" width="190" height="96" rx="10" fill="${pOk ? C.navy : C.badS}" stroke="${pOk ? C.navy : C.bad}" stroke-width="1.6"/>`;
  g += svgText(296, mid - 22, ["ICAO PARENT (CICTT)"], "", 10.5, 700, pOk ? C.on : C.bad);
  g += svgText(296, mid + 4, [p.code], "", 20, 700, pOk ? C.on : C.bad);
  const pn = wrapText(p.name, 26); const pl = pn.slice(0, 2); if (pn.length > 2) pl[1] = pl[1] + "...";
  g += svgText(296, mid + 26, pl, "", 11.5, 400, pOk ? C.on : C.bad) + `</g>`;
  if (changed) g += svgText(296, mid + 70, [`was ${c.proposed_parent} (discovery)`], "", 11.5, 700, C.warn);
  // definitions
  const dy0 = mid - (defs.length * 96 - 16) / 2;
  defs.forEach((id, i) => {
    const d = S.defs[id]; const y = dy0 + i * 96;
    const okx = d && d.parents.includes(o.parent_code);
    g += line(470, mid, 520, y + 40, okx ? C.teal : C.bad, !okx);
    g += `<g class="nodehit" data-jump="def-${esc(id)}"><rect x="520" y="${y}" width="210" height="80" rx="9" fill="${okx ? C.tealS : C.badS}" stroke="${okx ? C.teal : C.bad}" stroke-width="1.4"/>`;
    g += svgText(533, y + 20, [`${id}`], "", 11.5, 700, okx ? C.teal : C.bad);
    g += svgText(533, y + 38, wrapText(d ? d.term : "Not found", 30).slice(0, 2), "", 12, 600, C.ink);
    g += svgText(533, y + 70, [d ? "crosswalk: " + d.parents.join(", ") : "unknown id"], "", 10.5, 400, C.muted) + `</g>`;
  });
  if (!defs.length) g += svgText(533, mid, ["No definitions linked"], "", 12, 600, C.bad);
  // reports
  const ry0 = mid - (reps.length * (RH + RG) - RG) / 2;
  reps.forEach((r, i) => {
    const y = ry0 + i * (RH + RG); const rep = S.reports[r.report_key];
    const col = r.kind === "fn" ? C.warn : r.kind === "fp" ? C.bad : C.ok;
    const fill = r.kind === "fn" ? C.surf : r.kind === "fp" ? C.badS : C.okS;
    g += line(730, mid, 770, y + RH / 2, col, r.kind === "fn");
    const label = r.kind === "fn" ? "expected - missed" : r.kind === "fp" ? "not expected" : "";
    g += `<g class="nodehit" data-jump="rep-${esc(r.report_key)}"><rect x="770" y="${y}" width="224" height="${RH}" rx="9" fill="${fill}" stroke="${col}" stroke-width="1.4" ${r.kind === "fn" ? 'stroke-dasharray="5 4"' : ""}/>`;
    g += svgText(782, y + 18, [`${r.report_key}${rep ? "  [" + rep.l1_codes.join(", ") + "]" : ""}`], "", 11, 700, col);
    const ev = r.evidence || (rep ? rep.narrative : "");
    g += svgText(782, y + 35, wrapText("'" + ev + "'", 40).slice(0, 2).map((l, j, a) => j === 1 && wrapText(ev, 40).length > 2 ? l + "..." : l), "", 10.5, 400, C.ink, 1.35);
    if (label) g += svgText(990, y + 18, [label], "", 10, 700, col).replace("<text ", '<text text-anchor="end" ');
    g += `</g>`;
  });
  if (!reps.length) g += svgText(782, mid, ["No supporting reports"], "", 12, 600, C.bad);
  // column labels
  g += svgText(520, 18, ["INDUSTRY DEFINITIONS"], "", 11, 700, C.teal) + svgText(770, 18, ["SUPPORTING REPORTS"], "", 11, 700, C.ok);
  return `<svg viewBox="0 0 ${W} ${H + 10}" role="img" aria-label="Grounding chain for ${esc(c.candidate_id)}">${g}</svg>`;
}

/* ---------------- candidates view ---------------- */
function highlight(text, ev) {
  if (!ev) return esc(text);
  const i = text.indexOf(ev);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(ev) + "</mark>" + esc(text.slice(i + ev.length));
}
function codeChips(codes, parent) { return `<span class="codes">${codes.map(c => `<span class="code" ${c === parent ? 'style="background:var(--navy);color:var(--on-navy)"' : ""}>${esc(c)}</span>`).join("")}</span>`; }

function renderCandidates() {
  const rs = results();
  if (!S.cand || !byCand(S.cand)) S.cand = rs[0] && rs[0].candidate.candidate_id;
  const q = S.q.toLowerCase();
  const shown = rs.filter(r => (S.filter === "all" || r.status === S.filter) && (!q || (r.candidate.name + " " + r.candidate.candidate_id + " " + r.output.parent_code).toLowerCase().includes(q)));
  const counts = k => rs.filter(r => k === "all" || r.status === k).length;
  const chip = (k, l) => `<button type="button" class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${l} - ${counts(k)}</button>`;
  const list = `<div class="list">
    <div class="filters">${chip("all", "All")}${chip("grounded", "Grounded")}${chip("needs_review", "Review")}${chip("not_grounded", "Not grounded")}</div>
    <input type="search" id="cq" placeholder="Search candidates or parent code" value="${esc(S.q)}" aria-label="Search candidates">
    ${shown.map(r => `<button type="button" class="citem st-${r.status}" data-cand="${esc(r.candidate.candidate_id)}" aria-current="${r.candidate.candidate_id === S.cand}">
      <span class="id">${esc(r.candidate.candidate_id)}</span><span class="nm">${esc(r.candidate.name)}</span>
      <span class="mt"><span class="code">${esc(r.output.parent_code)}</span> - ${r.output.definition_ids.length} def - ${r.output.supporting_reports.length} report${r.output.supporting_reports.length === 1 ? "" : "s"} - ${esc(STATUS_LABEL[r.status])}</span></button>`).join("") || `<p class="mt">No candidates match.</p>`}
  </div>`;
  const res = byCand(S.cand);
  return `<div class="cgrid">${list}<div class="detail">${res ? detail(res) : ""}</div></div>`;
}

function detail(res) {
  const c = res.candidate, o = res.output, d = res.diag || {}, m = res.metrics || {};
  const changed = o.parent_code !== c.proposed_parent;
  const checks = res.checks.map(ch => {
    const cls = ch.passed ? "p" : ch.severity === "review" ? "r" : "b";
    return `<li><span class="ic ${cls}" aria-label="${ch.passed ? "pass" : "fail"}">${ch.passed ? "Y" : "X"}</span><span class="cid">${esc(ch.id)}</span><span>${esc(ch.name)}<small>${esc(ch.detail)}${!ch.passed ? (ch.severity === "review" ? " - sends to SME review" : " - blocks grounding") : ""}</small></span></li>`;
  }).join("");
  const ps = Object.entries(d.parent_scores || {});
  const max = Math.max(...ps.map(x => x[1]), 0.001);
  const bars = ps.map(([k, v]) => `<div class="brow ${k === o.parent_code ? "win" : ""}"><span class="mono">${esc(k)}</span><span class="track"><span class="fill" style="width:${(100 * v / max).toFixed(1)}%;display:block"></span></span><span class="num">${v.toFixed(2)}</span></div>`).join("");
  const defs = o.definition_ids.map(id => { const df = S.defs[id]; const okx = df && df.parents.includes(o.parent_code);
    return `<div class="def" id="def-${esc(id)}" style="border-top-color:${okx ? "var(--teal)" : "var(--bad)"}"><div class="t"><span class="code">${esc(id)}</span> ${esc(df ? df.term : "Unknown definition")}</div>
      ${df ? `<div class="src">${esc(df.source)}</div><div>${esc(df.text)}</div><div class="x">Crosswalk: ${esc(df.parents.join(", "))}${okx ? "" : " - not crosswalked to " + esc(o.parent_code)}</div>` : `<div class="x">This id is not in the definitions store.</div>`}</div>`; }).join("") || `<p>No definitions linked.</p>`;
  const exp = new Set(c.expected_reports || []);
  const reps = o.supporting_reports.map(s => { const r = S.reports[s.report_key]; const inText = r && r.narrative.includes(s.evidence);
    const k = !exp.size ? "" : exp.has(s.report_key) ? `<span class="badge tp">in answer key</span>` : `<span class="badge fp">not in answer key</span>`;
    const sc = (d.support || []).find(x => x.report_key === s.report_key);
    return `<div class="rep" id="rep-${esc(s.report_key)}"><div class="top"><span class="k">${esc(s.report_key)}</span>${r ? codeChips(r.l1_codes, o.parent_code) : ""}${r ? `<span style="color:var(--muted)">${esc(r.phase)}</span>` : ""}${sc && S.mode === "rules" ? `<span style="color:var(--muted)">score ${sc.score.toFixed(2)}</span>` : ""}${k}${r && !inText ? `<span class="badge fp">quote not found</span>` : ""}</div>
      <p>${r ? highlight(r.narrative, s.evidence) : `'${esc(s.evidence)}' <em style="color:var(--muted)">(report text not loaded)</em>`}</p>
      ${r && r.source_codes ? `<div style="font-size:12.5px;color:var(--muted)">Source codes: ${esc(r.source_codes)}</div>` : ""}</div>`; }).join("");
  const missed = (m.fn || []).map(k => { const r = S.reports[k];
    return `<div class="rep" id="rep-${esc(k)}" style="border-style:dashed"><div class="top"><span class="k">${esc(k)}</span>${r ? codeChips(r.l1_codes, o.parent_code) : ""}<span class="badge fn">expected - not linked</span></div><p>${r ? esc(r.narrative) : ""}</p></div>`; }).join("");
  const other = S.mode === "rules" ? S.runs.llm : S.runs.rules;
  const oth = other && byCand(c.candidate_id, other);
  let cmp = "";
  if (oth) {
    const a = new Set(o.supporting_reports.map(s => s.report_key)), b = new Set(oth.output.supporting_reports.map(s => s.report_key));
    const onlyA = [...a].filter(x => !b.has(x)), onlyB = [...b].filter(x => !a.has(x));
    const name = S.mode === "rules" ? "Constrained prompt" : "Rules selector";
    cmp = `<div class="panel"><h2>Compared with the ${esc(name.toLowerCase())}</h2><div class="diff">
      <div><b>Parent</b><span>${esc(o.parent_code)} here - ${esc(oth.output.parent_code)} there${o.parent_code === oth.output.parent_code ? " (same)" : ""}</span></div>
      <div><b>Status</b><span>${esc(STATUS_LABEL[res.status])} here - ${esc(STATUS_LABEL[oth.status])} there</span></div>
      <div><b>Only here</b><span>${onlyA.length ? onlyA.map(esc).join(", ") : "none"}</span></div>
      <div><b>Only there</b><span>${onlyB.length ? onlyB.map(esc).join(", ") : "none"}</span></div>
      ${oth.output.concerns && S.mode === "rules" ? `<div><b>Prompt's concerns</b><span>${esc(oth.output.concerns)}</span></div>` : ""}</div></div>`;
  }
  return `<div class="dhead"><div class="eyebrow">Candidate <span class="code">${esc(c.candidate_id)}</span> ${pill(res.status)}</div>
      <h1>${esc(c.name)}</h1><p>${esc(c.definition)}</p></div>
    ${changed ? `<div class="note">Discovery proposed <b>${esc(c.proposed_parent)}</b>; grounding chose <b>${esc(o.parent_code)}</b>. An SME should confirm the parent.</div>` : ""}
    ${o.concerns ? `<div class="note info"><b>Concerns raised:</b> ${esc(o.concerns)}</div>` : ""}
    <div class="panel"><h2>Grounding chain <span>click a box to jump to it</span></h2><div class="chainwrap">${chainSVG(res)}</div></div>
    <div class="two">
      <div class="panel"><h2>Checks <span>${res.checks.filter(x => x.passed).length} of ${res.checks.length} passed</span></h2><ul class="checks">${checks}</ul></div>
      <div class="panel" id="parent"><h2>Parent choice <span>0.3 x definition fit + 0.7 x report vote</span></h2>
        <div class="bars">${bars || "<p>No parent scores in this run.</p>"}</div>
        <div class="kv"><div><b>${d.parent_agreement != null ? pct(d.parent_agreement) : "-"}</b>closest reports under ${esc(o.parent_code)}</div>
          <div><b>${d.margin != null ? d.margin.toFixed(2) : "-"}</b>margin over ${esc(d.runner_up || "-")}</div>
          <div><b>${d.co_codes && d.co_codes.length ? esc(d.co_codes.join(", ")) : "none"}</b>suggested co-codes</div></div>
        ${d.moved_to_sibling && d.moved_to_sibling.length && S.mode === "rules" ? `<p style="font-size:13.5px;margin:12px 0 0;color:var(--muted)">Given to a better-matching sibling: ${d.moved_to_sibling.map(x => `${esc(x[0])} -> <a href="#cand-${esc(x[1])}">${esc(x[1])}</a>`).join(", ")}</p>` : ""}
      </div>
    </div>
    <div class="panel"><h2>Industry definitions <span>${o.definition_ids.length} linked</span></h2><div class="defs">${defs}</div></div>
    <div class="panel"><h2>Supporting reports <span>evidence highlighted - ${o.supporting_reports.length} linked${(m.fn || []).length ? " - " + m.fn.length + " expected but missed" : ""}</span></h2><div class="reps">${reps}${missed}</div></div>
    ${cmp}`;
}

/* ---------------- matrix ---------------- */
function renderMatrix() {
  const rs = results(); const ids = rs.length ? rs[0].checks.map(c => c.id) : [];
  const cell = ch => { const cls = ch.passed ? "p" : ch.severity === "review" ? "r" : "b"; return `<td class="c" title="${esc(ch.name)}: ${esc(ch.detail)}"><span class="ic ${cls}" style="margin:auto">${ch.passed ? "Y" : "X"}</span></td>`; };
  return `<div class="sec"><h2>Check matrix</h2><p class="lead">Every candidate against the eight checks. Green passes, orange sends the candidate to SME review, red blocks grounding. Click a row to open the candidate.</p>
    <div class="tbl"><table><thead><tr><th>Candidate</th><th>Parent</th><th class="c">Defs</th><th class="c">Reports</th>${ids.map(i => `<th class="c" title="${esc(CHECK_NAMES[i] || i)}">${esc(i)}</th>`).join("")}<th>Status</th></tr></thead><tbody>
    ${rs.map(r => `<tr class="clk" data-open="${esc(r.candidate.candidate_id)}" tabindex="0"><td><span class="mono">${esc(r.candidate.candidate_id)}</span> ${esc(r.candidate.name)}</td>
      <td><span class="code">${esc(r.output.parent_code)}</span>${r.output.parent_code !== r.candidate.proposed_parent ? ` <span style="color:var(--warn);font-size:12.5px">was ${esc(r.candidate.proposed_parent)}</span>` : ""}</td>
      <td class="c">${r.output.definition_ids.length}</td><td class="c">${r.output.supporting_reports.length}</td>${r.checks.map(cell).join("")}<td>${pill(r.status)}</td></tr>`).join("")}
    </tbody></table></div></div>
    <div class="sec"><h2>The checks</h2><div class="tbl"><table><thead><tr><th>ID</th><th>Check</th><th>If it fails</th></tr></thead><tbody>
    ${Object.entries(CHECK_NAMES).map(([k, v]) => `<tr><td class="mono">${k}</td><td>${esc(v)}</td><td>${["G6", "G7", "G8"].includes(k) ? pill("needs_review") : pill("not_grounded")}</td></tr>`).join("")}</tbody></table></div></div>`;
}

/* ---------------- compare ---------------- */
function renderCompare() {
  const A = S.runs.rules, B = S.runs.llm;
  if (!A || !B) return `<div class="drop">Load both a rules result and a constrained-prompt result to compare them.</div>`;
  const rows = A.results.map(a => { const b = byCand(a.candidate.candidate_id, B); if (!b) return "";
    const ka = new Set(a.output.supporting_reports.map(s => s.report_key)), kb = new Set(b.output.supporting_reports.map(s => s.report_key));
    const oa = [...ka].filter(x => !kb.has(x)), ob = [...kb].filter(x => !ka.has(x));
    return `<tr class="clk" data-open="${esc(a.candidate.candidate_id)}" tabindex="0"><td><span class="mono">${esc(a.candidate.candidate_id)}</span> ${esc(a.candidate.name)}</td>
      <td><span class="code">${esc(a.output.parent_code)}</span> ${pill(a.status)}</td><td><span class="code">${esc(b.output.parent_code)}</span> ${pill(b.status)}</td>
      <td class="mono">${oa.map(esc).join(", ") || "-"}</td><td class="mono">${ob.map(esc).join(", ") || "-"}</td><td style="font-size:13.5px">${esc(b.output.concerns || "")}</td></tr>`; }).join("");
  const sa = A.summary, sb = B.summary;
  return `<div class="sec"><h2>Rules selector vs constrained prompt</h2>
    <p class="lead">The same retrieval feeds both. The rules selector picks links by score; the constrained prompt asks an LLM to choose from the same closed lists and quote evidence exactly. Both go through the same checks.</p>
    ${B.results.length < A.results.length ? `<div class="note info" style="margin-bottom:14px">Constrained-prompt answers exist for ${B.results.length} of the ${A.results.length} candidates (${esc(B.results.map(r => r.candidate.candidate_id).join(", "))}). The table and the summary compare only those; the prompt's summary figures cover its ${B.results.length} candidates.</div>` : ""}
    <div class="tbl" style="margin-bottom:16px"><table><thead><tr><th>Measure</th><th>Rules selector</th><th>Constrained prompt</th></tr></thead><tbody>
      <tr><td>Parents correct</td><td>${sa.parent_correct} / ${sa.candidates}</td><td>${sb.parent_correct} / ${sb.candidates}</td></tr>
      <tr><td>Report links - precision</td><td>${pct(sa.report_precision)}</td><td>${pct(sb.report_precision)}</td></tr>
      <tr><td>Report links - recall</td><td>${pct(sa.report_recall)}</td><td>${pct(sb.report_recall)}</td></tr>
      <tr><td>Grounded / review / not grounded</td><td>${sa.status.grounded} / ${sa.status.needs_review} / ${sa.status.not_grounded}</td><td>${sb.status.grounded} / ${sb.status.needs_review} / ${sb.status.not_grounded}</td></tr></tbody></table></div>
    <div class="tbl"><table><thead><tr><th>Candidate</th><th>Rules</th><th>Prompt</th><th>Reports only in rules</th><th>Reports only in prompt</th><th>Prompt's concerns</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${S.synthetic && S.runs.llm === SEED.llm ? `<p class="lead" style="margin-top:12px">In the trial the constrained-prompt answers were written from the filled prompts by the same assistant that wrote the answer key, so this comparison shows the mechanism, not independent accuracy.</p>` : ""}</div>`;
}

/* ---------------- guardrails / parents ---------------- */
const FAULT = {

/* ---------------- loading files ---------------- */
function parseCSV(t) { const lines = t.trim().split(/\r?\n/); const h = lines.shift().split(","); return lines.map(l => { const v = l.split(","); return Object.fromEntries(h.map((k, i) => [k, v[i]])); }); }
async function loadFiles(files) {
  const got = [];
  for (const f of files) {
    try {
      const txt = await f.text();
      if (f.name.toLowerCase().endsWith(".csv")) {
        const rows = parseCSV(txt);
        if (rows[0] && "test" in rows[0]) { S.guardrails = rows; got.push("guardrail tests"); }
        else if (rows[0] && "mode" in rows[0]) { S.parentSel = rows; got.push("parent selection"); }
        continue;
      }
      const j = JSON.parse(txt);
      if (j.results && Array.isArray(j.results)) {
        const key = j.manual ? "manual" : j.mode === "deterministic" ? "rules" : "llm";
        if (key === "manual") j.mode = "manual";
        if (key === "rules" && j.settings) for (const k of Object.keys(TRY_DEFAULTS)) if (typeof j.settings[k] === "number") TS[k] = TRY_DEFAULTS[k] = j.settings[k];
        S.runs[key] = j; got.push({ rules: "rules results", llm: "prompt results", manual: `${j.results.length} typed candidates` }[key]); S.mode = key;
      } else if (j.reports) { S.reports = Object.fromEntries(j.reports.map(r => [r.report_key, r])); got.push(`${j.reports.length} reports`); S.isSynth = /synthetic/i.test(j._note || ""); }
      else if (j.definitions) { S.defs = Object.fromEntries(j.definitions.map(d => [d.id, d])); got.push(`${j.definitions.length} definitions`); }
      else if (j.categories) { S.parents = Object.fromEntries(j.categories.map(p => [p.code, p])); got.push(`${j.categories.length} parents`); }
      else got.push(`${f.name}: not recognised`);
    } catch (e) { got.push(`${f.name}: could not be read (${e.message})`); }
  }
  if (got.length) {
    S.synthetic = !!S.isSynth; S.loadedNote = "Loaded: " + got.join(", ");
    for (const k of ["rules", "llm"]) if (S.runs[k] && S.runs[k] === SEED[k] && got.some(g => g.includes("results"))) delete S.runs[k];
    if (!S.runs[S.mode]) S.mode = S.runs.rules ? "rules" : "llm";
    S.cand = null; ENGINE = null; toast(S.loadedNote); render();
  }
}


/* ---------------- try a candidate: the grounding process in the browser ----------------
   Mirrors grounding.py: RETRIEVE (hybrid vector + keyword) -> PARENT (definition fit + report vote)
   -> DEFINE (crosswalked definitions) -> SUPPORT (reports under the parent + exact evidence) -> VERIFY (G1-G8).
   Vectors here are TF-IDF word + word-pair vectors built from the loaded data, so scores differ a little
   from the pgvector run; interactive.py runs the exact pipeline. */
const TRY_DEFAULTS = { vector_weight: 0.6, pool_size: 10, relative_cutoff: 0.4, min_score: 0.15, parent_def_weight: 0.3,
  parent_margin: 0.10, max_definitions: 3, max_reports: 8, min_support: 3, min_parent_agreement: 0.6 };
if (SEED.rules && SEED.rules.settings) for (const k of Object.keys(TRY_DEFAULTS)) if (typeof SEED.rules.settings[k] === "number") TRY_DEFAULTS[k] = SEED.rules.settings[k];
const TS = Object.assign({}, TRY_DEFAULTS);
S.tryForm = { name: "", definition: "", proposed: "" }; S.tryRes = null; S.tryStep = 5; S.tryN = 0;
let ENGINE = null;
const STOPW = new Set(("a an the and or of to in on at for from by with without is are was were be been being it its this that these those than then as into over under after before during " +
  "other such any all not no can may per their there which while who whom what when where also has have had do does did but if so very more most out up down off onto via each").split(" "));
const ABBR = { rwy: "runway", twy: "taxiway", acft: "aircraft", eng: "engine", apch: "approach", dep: "departure", arr: "arrival", wx: "weather", hyd: "hydraulic",
  ldg: "landing", tkof: "takeoff", "t/o": "takeoff", atc: "atc", fo: "first officer", capt: "captain", alt: "altitude", hdg: "heading", spd: "speed", nav: "navigation" };
function stem(w) {
  if (w.length > 5 && w.endsWith("ing")) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.length > 4 && w.endsWith("ed")) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith("es") && /(ss|sh|ch|x)es$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
}
function words(t) {
  const raw = String(t).toLowerCase().match(/[a-z0-9]+(?:[\/-][a-z0-9]+)*/g) || [];
  const out = [];
  for (let w of raw) { w = ABBR[w] || w; for (const p of w.split(/[\s-]+/)) if (p.length > 1 && !STOPW.has(p)) out.push(stem(p)); }
  return out;
}
function terms(t) { const w = words(t); const out = w.slice(); for (let i = 0; i + 1 < w.length; i++) out.push(w[i] + "_" + w[i + 1]); return out; }
function buildEngine() {
  const P = Object.values(S.parents), D = Object.values(S.defs), R = Object.values(S.reports);
  const docs = [...P.map(p => `${p.name}. ${p.definition}`), ...D.map(d => `${d.term}. ${d.text}`), ...R.map(r => r.narrative)];
  const df = new Map();
  for (const d of docs) for (const t of new Set(terms(d))) df.set(t, (df.get(t) || 0) + 1);
  const N = docs.length, idf = t => Math.log((1 + N) / (1 + (df.get(t) || 0))) + 1;
  const vec = text => { const tf = new Map(); for (const t of terms(text)) tf.set(t, (tf.get(t) || 0) + 1);
    const v = new Map(); let nn = 0; for (const [t, f] of tf) { const x = (1 + Math.log(f)) * idf(t); v.set(t, x); nn += x * x; }
    nn = Math.sqrt(nn) || 1; for (const [t, x] of v) v.set(t, x / nn); return v; };
  const cos = (a, b) => { let s = 0; const [x, y] = a.size < b.size ? [a, b] : [b, a]; for (const [t, v] of x) { const u = y.get(t); if (u) s += v * u; } return s; };
  const kw = (qset, text) => { const ws = new Set(words(text)); let s = 0; for (const q of qset) if (ws.has(q)) s += idf(q); return s; };  // like ts_rank: matched query words, weighted by rarity
  const sents = t => String(t).trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  return { idf, vec, cos, kw, sents,
    P: P.map(p => ({ ...p, v: vec(`${p.name}. ${p.definition}`) })),
    D: D.map(d => ({ ...d, v: vec(`${d.term}. ${d.text}`), txt: `${d.term}. ${d.text}` })),
    R: R.map(r => ({ ...r, v: vec(r.narrative), ss: sents(r.narrative).map(x => ({ s: x, v: vec(x) })) })) };
}
function relevantT(items, key = "score") {
  if (!items.length) return { kept: [], cut: 0 };
  const top = Math.max(...items.map(i => i[key])); const cut = Math.max(TS.min_score, TS.relative_cutoff * top);
  return { kept: items.filter(i => i[key] >= cut), cut };
}
function hybrid(E, list, qv, qset, textOf, limit) {

  const mk = Math.max(0, ...rows.map(r => r.kw)) || 1;
  rows.forEach(r => { r.kwn = r.kw / mk; r.score = w * r.cos + (1 - w) * r.kwn; });
  return rows.sort((a, b) => b.score - a.score).slice(0, limit);
}
function groundTyped(name, definition, proposed, cid) {

  // 1 retrieve: reports with no parent filter
  const poolAll = hybrid(E, E.R, qv, qset, r => r.narrative, TS.pool_size);
  const { kept: pool, cut: poolCut } = relevantT(poolAll);
  // 2 parent
  const allowed = E.P.filter(p => p.in_scope && !p.co_code_only);
  const tot = pool.reduce((a, p) => a + p.score, 0) || 1;
  const rows = allowed.map(p => { const fit = Math.max(0, E.cos(qv, p.v)); const vote = pool.filter(r => r.x.l1_codes.includes(p.code)).reduce((a, r) => a + r.score, 0) / tot;
    return { code: p.code, name: p.name, fit, vote, score: TS.parent_def_weight * fit + (1 - TS.parent_def_weight) * vote }; }).sort((a, b) => b.score - a.score);

  const defAll = hybrid(E, E.D.filter(d => (d.parents || []).includes(par.code)), qv, qset, d => d.txt, 5);
  const { kept: defKept, cut: defCut } = relevantT(defAll);

  const supAll = hybrid(E, E.R.filter(r => r.l1_codes.includes(par.code)), qv, qset, r => r.narrative, TS.max_reports * 2);
  const { kept: supKept, cut: supCut } = relevantT(supAll);

    const ss = r.x.ss.map(s => ({ s: s.s, c: E.cos(qv, s.v), k: E.kw(qset, s.s) })); const tk = Math.max(0, ...ss.map(s => s.k)) || 1;
    const best = ss.reduce((a, b) => (0.5 * b.c + 0.5 * b.k / tk > 0.5 * a.c + 0.5 * a.k / tk ? b : a), ss[0]);
    return { report_key: r.x.report_key, evidence: best ? best.s : "", score: +r.score.toFixed(3) }; });
  const output = { candidate_id: cid, parent_code: par.code, definition_ids: defs.map(d => d.x.id),
    supporting_reports: support.map(s => ({ report_key: s.report_key, evidence: s.evidence })), concerns: "" };
  const voteOf = Object.fromEntries(rows.map(r => [r.code, r.vote]));
  const diag = { candidate: name, proposed_parent: proposed || "", co_codes: rows.slice(1).filter(r => r.vote >= TS.min_parent_agreement).map(r => r.code),
    parent_scores: Object.fromEntries(rows.slice(0, 4).map(r => [r.code, +r.score.toFixed(3)])), runner_up: runner.code,
    margin: +(par.score - runner.score).toFixed(3), parent_agreement: +voteOf[par.code].toFixed(3), parent_definition_rank: fitRank,
    definitions: defs.map(d => ({ def_id: d.x.id, source: d.x.source, term: d.x.term, score: +d.score.toFixed(3) })), support,
    pool: pool.map(p => ({ report_key: p.x.report_key, l1: p.x.l1_codes, score: +p.score.toFixed(3) })) };
  const { status, checks } = verifyT(output, proposed, diag);
  const trace = { poolAll, poolCut, rows, defAll, defCut, supAll, supCut, qterms: [...qset] };
  return { candidate: { candidate_id: cid, name, definition, proposed_parent: proposed || "", expected_parent: null, expected_reports: [], manual: true },
    output, diag, status, checks, trace };
}
function verifyT(o, proposed, diag) {
  const p = o.parent_code, P = S.parents[p], C = [];
  const add = (id, passed, detail, severity = "block") => C.push({ id, name: CHECK_NAMES[id], passed, detail, severity });
  add("G1", !!P && P.in_scope && !P.co_code_only, `parent = ${p}`);
  const bad = o.definition_ids.filter(d => !S.defs[d]), wx = o.definition_ids.filter(d => S.defs[d] && !(S.defs[d].parents || []).includes(p));
  const nd = o.definition_ids.length - bad.length - wx.length;
  add("G2", !bad.length && !wx.length && nd >= 1, `${nd} valid` + (bad.length ? `; unknown ${bad}` : "") + (wx.length ? `; not crosswalked to ${p}: ${wx}` : ""));
  const sup = o.supporting_reports, bk = sup.filter(s => !S.reports[s.report_key]).map(s => s.report_key);
  const nq = sup.filter(s => S.reports[s.report_key] && !S.reports[s.report_key].narrative.includes(s.evidence)).map(s => s.report_key);
  const off = sup.filter(s => S.reports[s.report_key] && !S.reports[s.report_key].l1_codes.includes(p)).map(s => s.report_key);
  add("G3", !bk.length && !off.length, !bk.length && !off.length ? "ok" : `unknown ${bk}; not under ${p}: ${off}`);
  add("G4", !nq.length, nq.length ? `not found in report: ${nq}` : "all quotes found in the report text");
  const ok = sup.length - new Set([...bk, ...nq, ...off]).size;

  add("G7", diag.margin >= TS.parent_margin, `margin ${diag.margin.toFixed(2)} over ${diag.runner_up} (need ${TS.parent_margin.toFixed(2)})`, "review");
  if (proposed) add("G8", p === proposed, `proposed ${proposed}, grounded ${p}`, "review");

}
